<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6F7">
<title>حِرز · تدريب الشاطبية</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF6F7; --card:#FFFFFF; --ink:#3A2C3B; --muted:#857584; --line:#EADCE1;
  --rose:#C25B6B; --rose-soft:#F6E3E7; --mint:#4E9A8C; --mint-soft:#E1F1EC;
  --lav:#7F74B3; --lav-soft:#ECE9F6; --ramz:#C0392B; --wrong:#B23A50;
  --verse:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  --ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --hand:'Aref Ruqaa','Amiri',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1F1820; --card:#2A2129; --ink:#F2E8EE; --muted:#B5A3B1; --line:#3E323D;
  --rose:#E08797; --rose-soft:#3A2630; --mint:#7CC4B5; --mint-soft:#203A35;
  --lav:#ABA2DA; --lav-soft:#2C2840; --ramz:#F07A6B; --wrong:#F08A9C;}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:18px 18px 40px}
a{color:var(--lav)}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* رأس */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-family:var(--hand);font-size:28px;color:var(--rose);line-height:1;background:none;border:0;padding:4px 0;cursor:pointer}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);font-size:15px}

/* البطل */
.hero{padding:26px 4px 8px}
.hero h1{font-family:var(--hand);font-weight:700;font-size:56px;line-height:1.1;margin:0;color:var(--ink)}
.hero h1 span{color:var(--rose)}
.hero p{margin:6px 0 0;color:var(--muted)}
.bayt{font-family:var(--verse);font-size:23px;line-height:2;margin:22px 0 6px;padding:16px 18px;background:var(--card);border-radius:18px;border:1px solid var(--line);text-align:center}
.bayt .h{display:block}
.r{color:var(--ramz)}

/* أزرار رئيسية */
.actions{display:grid;gap:10px;margin:22px 0}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:right;border:0;border-radius:16px;padding:15px 18px;cursor:pointer;font-weight:600;background:var(--card);border:1px solid var(--line)}
.btn small{font-weight:400;color:var(--muted);font-size:14px}
.btn.main{background:var(--rose);color:#fff;border-color:transparent}
.btn.main small{color:#fff;opacity:.85}
.btn:active{transform:scale(.99)}
.pill{display:inline-block;min-width:26px;padding:0 9px;border-radius:999px;background:var(--rose-soft);color:var(--rose);font-size:14px;text-align:center}

/* الوحدات */
h2{font-size:15px;color:var(--muted);font-weight:500;margin:28px 4px 10px}
.units{display:grid;gap:8px}
.unit{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:right;width:100%}
.unit .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--lav-soft);color:var(--lav);font-size:14px;font-weight:600}
.unit .t{font-weight:600}
.unit .p{font-size:13px;color:var(--muted)}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--mint);border-radius:4px}
.pct{font-size:14px;color:var(--mint);font-weight:600;min-width:38px;text-align:left}

/* لوحة الوحدة */
.modes{display:grid;gap:10px;margin-top:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;text-align:right;width:100%}
.mode b{display:block;font-size:18px}
.mode span{color:var(--muted);font-size:14px}
.unit-head h1{font-size:26px;margin:4px 0 0}
.unit-head p{margin:0;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg button[disabled]{cursor:default}
.seg small{font-size:12px;opacity:.75}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* السؤال */
.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:8px}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--rose);transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.prompt{font-size:19px;font-weight:600;margin:0 0 14px}
.prompt.big{font-size:20px}
.symbig{font-family:var(--verse);font-size:56px;color:var(--ramz);text-align:center;line-height:1.3;margin:-4px 0 6px}
.qverse{font-family:var(--verse);font-size:22px;line-height:2;text-align:center;background:var(--lav-soft);border-radius:14px;padding:12px;margin-bottom:14px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;text-align:right;cursor:pointer;line-height:1.6}
.opt.verse{font-family:var(--verse);font-size:20px}
.opt.sel{border-color:var(--lav);background:var(--lav-soft)}
.opt.ok{border-color:var(--mint);background:var(--mint-soft)}
.opt.no{border-color:var(--wrong);background:var(--rose-soft)}
.opt[disabled]{cursor:default}
.tf{grid-template-columns:1fr 1fr}
input[type=text],textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--paper);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input.ok,textarea.ok{border-color:var(--mint)}
input.no,textarea.no{border-color:var(--wrong)}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:16px}
.fb.ok{background:var(--mint-soft)}
.fb.no{background:var(--rose-soft)}
.fb b{display:block}
.fb .ref{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.go{flex:1;border:0;border-radius:14px;padding:13px;background:var(--ink);color:var(--paper);font-weight:600;cursor:pointer}
.ghost{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:transparent;cursor:pointer;color:var(--muted)}
.flag{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:6px 0;margin-top:8px;text-decoration:underline}

/* الشاهد */
.sh-verse{font-family:var(--verse);font-size:21px;line-height:2.1;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 8px;margin-bottom:6px}
.sh-verse .half{display:block}
.tok{background:none;border:0;padding:0 2px;margin:0 1px;border-radius:8px;cursor:pointer;font:inherit;color:inherit}
.tok.on{background:var(--lav-soft);color:var(--lav);box-shadow:inset 0 -2px 0 var(--lav)}
.tok.right{color:var(--ramz);box-shadow:inset 0 -2px 0 var(--ramz)}
.tok.miss{color:var(--ramz);box-shadow:inset 0 -2px 0 var(--wrong);background:var(--rose-soft)}
.tok.extra{text-decoration:line-through;text-decoration-color:var(--wrong)}
.hint{font-size:13px;color:var(--muted);margin:0 0 16px;text-align:center}
.field{margin-top:14px}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 4px;font-size:14px;cursor:pointer;line-height:1.3}
.chip.reader{font-weight:600}
.chip.on{background:var(--lav);border-color:var(--lav);color:#fff}
.chip.ok{border-color:var(--mint)}
.chip.no{border-color:var(--wrong)}
.mark{font-size:14px;margin-inline-start:6px}

/* خريطة الحل */
.map{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.map h3{margin:0 0 4px;text-align:center;font-size:16px}
.map .root{background:var(--lav);color:#fff;border-radius:999px;padding:8px 14px;text-align:center;font-weight:600;margin:0 auto 12px;max-width:90%}
.branches{display:grid;gap:10px}
.br{border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:15px}
.br b{display:block;color:var(--rose)}
.br.sh{font-family:var(--verse);font-size:18px;line-height:1.9}
.br.sh b{font-family:var(--ui);font-size:15px;color:var(--lav)}
.br.rest b{color:var(--mint)}
.self{display:flex;gap:6px;margin-top:10px}
.self button{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;background:var(--paper);cursor:pointer;font-size:15px}
.self button.on{background:var(--ink);color:var(--paper)}

/* بطاقات */
.flash{perspective:1000px;margin:10px 0}
.fc{min-height:230px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;user-select:none}
.fc .front{font-size:22px;font-weight:600}
.fc .front.sym{font-family:var(--verse);font-size:64px;color:var(--ramz)}
.fc .front.v{font-family:var(--verse);font-size:23px;font-weight:400}
.fc .bk{font-size:18px;color:var(--ink)}
.fc .bk.v{font-family:var(--verse);font-size:23px}
.fc .lbl{font-size:13px;color:var(--muted);margin-top:10px}

/* المرجع */
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:right}
th{background:var(--lav-soft);font-weight:600}
td.s{font-family:var(--verse);font-size:21px;color:var(--ramz);width:56px;text-align:center}
.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--line);margin-bottom:18px}

/* النتيجة */
.score{text-align:center;padding:10px 0 4px}
.score .num{font-family:var(--hand);font-size:64px;color:var(--rose);line-height:1.1}
.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;font-size:15px}
.rev.no{border-color:var(--wrong)}
.rev .a{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* إهداء */
.ded{text-align:center;margin:46px 0 10px;color:var(--muted)}
.ded .to{font-family:var(--hand);font-size:26px;color:var(--rose);display:block;line-height:1.4}
.ded small{font-size:13px;display:block}
.ded .shatora{font-family:var(--hand);font-size:24px;color:var(--lav);display:block;margin-top:2px}
.timer{font-variant-numeric:tabular-nums}

/* المتصدرات */
.lb{display:grid;gap:8px;margin-top:10px}
.lbr{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.lbr.me{border-color:var(--rose);background:var(--rose-soft)}
.lbr .rk{font-size:20px;text-align:center;color:var(--muted)}
.lbr .nm{font-weight:600;overflow-wrap:anywhere}
.lbr small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.lbr .sc{font-weight:700;color:var(--rose);font-size:22px;text-align:left}
.mine{background:var(--lav-soft);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:15px}
.lnk{background:none;border:0;color:var(--lav);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===== حرز — البيانات وبنك الأسئلة ===== */
const READERS = [
  {id:'nafi',name:'نافع',sym:'أ',word:'أبج',nisba:'المدني',full:'نافع بن عبدالرحمن الليثي',death:167,via:'بلا واسطة',rawis:['qalun','warsh']},
  {id:'ibnkathir',name:'ابن كثير',sym:'د',word:'دهز',nisba:'المكي',full:'عبدالله بن كثير الداري',death:120,via:'بواسطة',rawis:['bazzi','qunbul']},
  {id:'abuamr',name:'أبو عمرو',sym:'ح',word:'حطي',nisba:'البصري',full:'زبان بن العلاء بن عمار المازني',death:155,via:'بواسطة يحيى اليزيدي',rawis:['duri_a','susi']},
  {id:'ibnamir',name:'ابن عامر',sym:'ك',word:'كلم',nisba:'الشامي',full:'عبدالله بن عامر بن يزيد اليحصبي',death:118,via:'بواسطة',rawis:['hisham','ibndhakwan']},
  {id:'asim',name:'عاصم',sym:'ن',word:'نصع',nisba:'الكوفي',full:'أبو بكر عاصم بن أبي النجود الأسدي',death:128,via:'بلا واسطة',rawis:['shuba','hafs']},
  {id:'hamza',name:'حمزة',sym:'ف',word:'فضق',nisba:'الكوفي',full:'أبو عمارة حمزة بن حبيب الزيات',death:156,via:'بواسطة سليم',rawis:['khalaf','khallad']},
  {id:'kisai',name:'الكسائي',sym:'ر',word:'رست',nisba:'الكوفي',full:'أبو الحسن علي بن حمزة النحوي',death:189,via:'بلا واسطة',rawis:['abulharith','duri_k']},
];
const RAWIS = [
  {id:'qalun',name:'قالون',sym:'ب',of:'nafi',full:'أبو موسى عيسى بن مينا',death:205},
  {id:'warsh',name:'ورش',sym:'ج',of:'nafi',full:'أبو سعيد عثمان بن سعيد المصري',death:197},
  {id:'bazzi',name:'البزي',sym:'ه',of:'ibnkathir',full:'أبو الحسن أحمد بن محمد البزي',death:255},
  {id:'qunbul',name:'قنبل',sym:'ز',of:'ibnkathir',full:'أبو عمرو محمد بن عبدالرحمن المخزومي',death:291},
  {id:'duri_a',name:'الدوري',label:'دوري أبي عمرو',sym:'ط',of:'abuamr',full:'أبو عمر حفص بن عمر الدوري البغدادي',death:246},
  {id:'susi',name:'السوسي',sym:'ي',of:'abuamr',full:'أبو شعيب صالح بن زياد السوسي الأهوازي',death:261},
  {id:'hisham',name:'هشام',sym:'ل',of:'ibnamir',full:'أبو الوليد هشام بن عمار بن نصير',death:246},
  {id:'ibndhakwan',name:'ابن ذكوان',sym:'م',of:'ibnamir',full:'عبدالله بن أحمد بن بشير بن ذكوان',death:242},
  {id:'shuba',name:'شعبة',sym:'ص',of:'asim',full:'أبو بكر شعبة المشهور بابن عياش',death:193},
  {id:'hafs',name:'حفص',sym:'ع',of:'asim',full:'أبو عمر حفص بن سليمان الكوفي',death:180},
  {id:'khalaf',name:'خلف',sym:'ض',of:'hamza',full:'أبو محمد خلف بن هشام البزار',death:229},
  {id:'khallad',name:'خلاد',sym:'ق',of:'hamza',full:'أبو عيسى خلاد بن خالد الصيرفي',death:220},
  {id:'abulharith',name:'أبو الحارث',sym:'س',of:'kisai',full:'أبو الحارث الليث بن خالد البغدادي',death:240},
  {id:'duri_k',name:'الدوري',label:'دوري الكسائي',sym:'ت',of:'kisai',full:'أبو عمر حفص الدوري',death:246},
];
const ALL = {}; READERS.forEach(r=>ALL[r.id]=r); RAWIS.forEach(r=>ALL[r.id]=r);
const label = id => ALL[id].label || ALL[id].name;
const KUFI = ['asim','hamza','kisai'];
const GROUPS = [
  {sym:'ث',kind:'حرفي',m:KUFI,desc:'الكوفيون: عاصم وحمزة والكسائي'},
  {sym:'خ',kind:'حرفي',m:['ibnkathir','abuamr','ibnamir',...KUFI],desc:'القراء السبعة ما عدا نافعاً'},
  {sym:'ذ',kind:'حرفي',m:[...KUFI,'ibnamir'],desc:'الكوفيون وابن عامر'},
  {sym:'ظ',kind:'حرفي',m:[...KUFI,'ibnkathir'],desc:'الكوفيون وابن كثير'},
  {sym:'غ',kind:'حرفي',m:[...KUFI,'abuamr'],desc:'الكوفيون وأبو عمرو'},
  {sym:'ش',kind:'حرفي',m:['hamza','kisai'],desc:'حمزة والكسائي'},
  {sym:'صحبة',kind:'كلمي',m:['hamza','kisai','shuba'],desc:'حمزة والكسائي وشعبة'},
  {sym:'صحاب',kind:'كلمي',m:['hamza','kisai','hafs'],desc:'حمزة والكسائي وحفص'},
  {sym:'عمّ',kind:'كلمي',m:['nafi','ibnamir'],desc:'نافع وابن عامر'},
  {sym:'سما',kind:'كلمي',m:['nafi','ibnkathir','abuamr'],desc:'نافع وابن كثير وأبو عمرو'},
  {sym:'حقّ',kind:'كلمي',m:['ibnkathir','abuamr'],desc:'ابن كثير وأبو عمرو'},
  {sym:'نفر',kind:'كلمي',m:['ibnkathir','abuamr','ibnamir'],desc:'ابن كثير وأبو عمرو وابن عامر'},
  {sym:'حرميّ',kind:'كلمي',m:['nafi','ibnkathir'],desc:'نافع وابن كثير'},
  {sym:'حصن',kind:'كلمي',m:[...KUFI,'nafi'],desc:'الكوفيون ونافع'},
];

const UNITS = [
  {id:'u1',title:'الشاطبي والقراء والرواة',pages:'ص ١–١٨'},
  {id:'u2',title:'الرموز الفردية',pages:'ص ٣–١٩'},
  {id:'u3',title:'الرموز الجماعية',pages:'ص ٢٧–٣١'},
  {id:'u4',title:'قواعد النظم والأضداد',pages:'ص ٢٠–٤٠'},
  {id:'u5',title:'الاستعاذة',pages:'ص ٤١–٤٨'},
  {id:'u6',title:'البسملة',pages:'ص ٤٩–٦٠'},
  {id:'u7',title:'سورة أم القرآن',pages:'ص ٦١–٦٩'},
  {id:'u8',title:'الإدغام الكبير',pages:'ص ٧٠–٨٩'},
  {id:'u9',title:'هاء الكناية',pages:'ص ٩٠–٩٣'},
  {id:'u10',title:'المد والقصر',pages:'ص ٩٤–١١١'},
  {id:'u11',title:'فرش البقرة (١–٦)',pages:'ص ١١٢–١١٧'},
  {id:'u12',title:'فرش البقرة (٧–٩)',pages:'ص ١٢٢–١٢٦'},
];

/* ===== الأبيات (مع رقم الوحدة) ===== */
const VERSES = {
  u1:[
    ['فَأَمَّا الْكَرِيمُ السِّرِّ فِي الطِّيبِ نَافِعٌ','فَذَاكَ الَّذِي اخْتَارَ الْمَدِينَةَ مَنْزِلَا'],
    ['وَقَالُونُ عِيسَى ثُمَّ عُثْمَانُ وَرْشُهُمْ','بِصُحْبَتِهِ الْمَجْدَ الرَّفِيعَ تَأَثَّلَا'],
    ['وَمَكَّةُ عَبْدُ اللَّهِ فِيهَا مُقَامُهُ','هُوَ ابْنُ كَثِيرٍ كَاثِرُ الْقَوْمِ مُعْتَلَا'],
    ['رَوَى أَحْمَدُ الْبَزِّي لَهُ وَمُحَمَّدٌ','عَلَى سَنَدٍ وَهْوَ الْمُلَقَّبُ قُنْبُلَا'],
    ['وَأَمَّا الْإِمَامُ الْمَازِنِيُّ صَرِيحُهُمْ','أَبُو عَمْرٍو الْبَصْرِي فَوَالِدُهُ الْعَلَا'],
    ['أَفَاضَ عَلَى يَحْيَى الْيَزِيدِيِّ سَيْبَهُ','فَأَصْبَحَ بِالْعَذْبِ الْفُرَاتِ مُعَلَّلَا'],
    ['أَبُو عُمَرَ الدُّورِي وَصَالِحُهُمْ أَبُو','شُعَيْبٍ هُوَ السُّوسِيُّ عَنْهُ تَقَبَّلَا'],
    ['وَأَمَّا دِمَشْقُ الشَّامِ دَارُ ابْنِ عَامِرٍ','فَتِلْكَ بِعَبْدِ اللَّهِ طَابَتْ مُحَلَّلَا'],
    ['هِشَامٌ وَعَبْدُ اللَّهِ وَهْوَ انْتِسَابُهُ','لِذَكْوَانَ بِالْإِسْنَادِ عَنْهُ تَنَقَّلَا'],
    ['وَبِالْكُوفَةِ الْغَرَّاءِ مِنْهُمْ ثَلَاثَةٌ','أَذَاعُوا فَقَدْ ضَاعَتْ شَذًا وَقَرَنْفُلَا'],
    ['فَأَمَّا أَبُو بَكْرٍ وَعَاصِمٌ اسْمُهُ','فَشُعْبَةُ رَاوِيهِ الْمُبَرِّزُ أَفْضَلَا'],
    ['وَذَاكَ ابْنُ عَيَّاشٍ أَبُو بَكْرٍ الرِّضَا','وَحَفْصٌ وَبِالْإِتْقَانِ كَانَ مُفَضَّلَا'],
    ['وَحَمْزَةُ مَا أَزْكَاهُ مِنْ مُتَوَرِّعٍ','إِمَامًا صَبُورًا لِلْقُرَانِ مُرَتِّلَا'],
    ['رَوَى خَلَفٌ عَنْهُ وَخَلَّادٌ الَّذِي','رَوَاهُ سُلَيْمٌ مُتْقِنًا وَمُحَصِّلَا'],
    ['وَأَمَّا عَلِيٌّ فَالْكِسَائِيُّ نَعْتُهُ','لِمَا كَانَ فِي الْإِحْرَامِ فِيهِ تَسَرْبَلَا'],
    ['رَوَى لَيْثُهُمْ عَنْهُ أَبُو الْحَارِثِ الرِّضَا','وَحَفْصٌ هُوَ الدُّورِي وَفِي الذِّكْرِ قَدْ خَلَا'],
  ],
  u3:[
    ['وَمِنْهُنَّ لِلْكُوفِيِّ ثَاءٌ مُثَلَّثٌ','وَسِتَّتُهُمْ بِالْخَاءِ لَيْسَ بِأَغْفَلَا'],
    ['عَنَيْتُ الْأُلَى أَثْبَتُّهُمْ بَعْدَ نَافِعٍ','وَكُوفٍ وَشَامٍ ذَالُهُمْ لَيْسَ مُغْفَلَا'],
    ['وَكُوفٍ مَعَ الْمَكِّيِّ بِالظَّاءِ مُعْجَمًا','وَكُوفٍ وَبَصْرٍ غَيْنُهُمْ لَيْسَ مُهْمَلَا'],
    ['وَذُو النَّقْطِ شِينٌ لِلْكِسَائِي وَحَمْزَةٍ','وَقُلْ فِيهِمَا مَعْ شُعْبَةٍ صُحْبَةٌ تَلَا'],
    ['صِحَابٌ هُمَا مَعْ حَفْصِهِمْ عَمَّ نَافِعٌ','وَشَامٍ سَمَا فِي نَافِعٍ وَفَتَى الْعَلَا'],
    ['وَمَكٍّ وَحَقٌّ فِيهِ وَابْنِ الْعَلَاءِ قُلْ','وَقُلْ فِيهِمَا وَالْيَحْصُبِي نَفَرٌ حَلَا'],
    ['وَحِرْمِيٌّ الْمَكِّيُّ فِيهِ وَنَافِعٌ','وَحِصْنٌ عَنِ الْكُوفِي وَنَافِعِهِمْ عَلَا'],
  ],
  u4:[
    ['جَعَلْتُ أَبَا جَادٍ عَلَى كُلِّ قَارِئٍ','دَلِيلًا عَلَى الْمَنْظُومِ أَوَّلَ أَوَّلَا'],
    ['وَمِنْ بَعْدِ ذِكْرِي الْحَرْفَ أُسْمِي رِجَالَهُ','مَتَى تَنْقَضِي آتِيكَ بِالْوَاوِ فَيْصَلَا'],
    ['سِوَى أَحْرُفٍ لَا رِيبَةٌ فِي اتِّصَالِهَا','وَبِاللَّفْظِ أَسْتَغْنِي عَنِ الْقَيْدِ إِنْ جَلَا'],
    ['وَرُبَّ مَكَانٍ كَرَّرَ الْحَرْفَ قَبْلَهَا','لِمَا عَارِضٍ وَالْأَمْرُ لَيْسَ مُهَوِّلَا'],
    ['وَهَا أَنَا ذَا أَسْعَى لَعَلَّ حُرُوفَهُمْ','يَطُوعُ بِهَا نَظْمُ الْقَوَافِي مُسَهِّلَا'],
    ['وَمَا كَانَ ذَا ضِدٍّ فَإِنِّي بِضِدِّهِ','غَنِيٌّ فَزَاحِمْ بِالذَّكَاءِ لِتَفْضُلَا'],
    ['وَحَيْثُ جَرَى التَّحْرِيكُ غَيْرَ مُقَيَّدٍ','هُوَ الْفَتْحُ وَالْإِسْكَانُ آخَاهُ مَنْزِلَا'],
    ['وَآخَيْتُ بَيْنَ النُّونِ وَالْيَا وَفَتْحِهِمْ','وَكَسْرٍ وَبَيْنَ النَّصْبِ وَالْخَفْضِ مُنْزِلَا'],
    ['وَحَيْثُ أَقُولُ الضَّمُّ وَالرَّفْعُ سَاكِتًا','فَغَيْرُهُمُ بِالْفَتْحِ وَالنَّصْبِ أَقْبَلَا'],
    ['وَفِي الرَّفْعِ وَالتَّذْكِيرِ وَالْغَيْبِ جُمْلَةٌ','عَلَى لَفْظِهَا أَطْلَقْتُ مَنْ قَيَّدَ الْعُلَا'],
    ['وَقَبْلَ وَبَعْدَ الْحَرْفِ آتِي بِكُلِّ مَا','رَمَزْتُ بِهِ فِي الْجَمْعِ إِذْ لَيْسَ مُشْكِلَا'],
    ['وَسَوْفَ أُسَمِّي حَيْثُ يَسْمَحُ نَظْمُهُ','بِهِ مُوضِحًا جِيدًا مُعَمًّا وَمُخْوَلَا'],
    ['وَمَنْ كَانَ ذَا بَابٍ لَهُ فِيهِ مَذْهَبٌ','فَلَا بُدَّ أَنْ يُسْمَى فَيُدْرَى وَيُعْقَلَا'],
  ],
  u5:[
    ['إِذَا مَا أَرَدْتَ الدَّهْرَ تَقْرَأُ فَاسْتَعِذْ','جِهَارًا مِنَ الشَّيْطَانِ بِاللَّهِ مُسْجَلَا'],
    ['عَلَى مَا أَتَى فِي النَّحْلِ يُسْرًا وَإِنْ تَزِدْ','لِرَبِّكَ تَنْزِيهًا فَلَسْتَ مُجَهَّلَا'],
    ['وَقَدْ ذَكَرُوا لَفْظَ الرَّسُولِ فَلَمْ يَزِدْ','وَلَوْ صَحَّ هَذَا النَّقْلُ لَمْ يُبْقِ مُجْمَلَا'],
    ['وَفِيهِ مَقَالٌ فِي الْأُصُولِ فُرُوعُهُ','فَلَا تَعْدُ مِنْهَا بَاسِقًا وَمُظَلِّلَا'],
    ['وَإِخْفَاؤُهُ فَصْلٌ أَبَاهُ وُعَاتُنَا','وَكَمْ مِنْ فَتًى كَالْمَهْدَوِي فِيهِ أَعْمَلَا'],
  ],
  u6:[
    ['وَبَسْمَلَ بَيْنَ السُّورَتَيْنِ بِسُنَّةٍ','رِجَالٌ نَمَوْهَا دِرْيَةً وَتَحَمُّلَا'],
    ['وَوَصْلُكَ بَيْنَ السُّورَتَيْنِ فَصَاحَةٌ','وَصِلْ وَاسْكُتَنْ كُلٌّ جَلَايَاهُ حَصَّلَا'],
    ['وَلَا نَصَّ كَلَّا حُبَّ وَجْهٌ ذَكَرْتُهُ','وَفِيهَا خِلَافٌ جِيدُهُ وَاضِحُ الطُّلَا'],
    ['وَسَكْتُهُمُ الْمُخْتَارُ دُونَ تَنَفُّسٍ','وَبَعْضُهُمُ فِي الْأَرْبَعِ الزُّهْرِ بَسْمَلَا'],
    ['لَهُمْ دُونَ نَصٍّ وَهْوَ فِيهِنَّ سَاكِتٌ','لِحَمْزَةَ فَافْهَمْهُ وَلَيْسَ مُخَذَّلَا'],
    ['وَمَهْمَا تَصِلْهَا أَوْ بَدَأْتَ بَرَاءَةً','لِتَنْزِيلِهَا بِالسَّيْفِ لَسْتَ مُبَسْمِلَا'],
    ['وَلَا بُدَّ مِنْهَا فِي ابْتِدَائِكَ سُورَةً','سِوَاهَا وَفِي الْأَجْزَاءِ خُيِّرَ مَنْ تَلَا'],
    ['وَمَهْمَا تَصِلْهَا مَعْ أَوَاخِرِ سُورَةٍ','فَلَا تَقِفَنَّ الدَّهْرَ فِيهَا فَتَثْقُلَا'],
  ],
  u7:[
    ['وَمَالِكِ يَوْمِ الدِّينِ رَاوِيهِ نَاصِرٌ','وَعِنْدَ سِرَاطٍ وَالسِّرَاطَ لِقُنْبُلَا'],
    ['بِحَيْثُ أَتَى وَالصَّادَ زَايًا أَشِمَّهَا','لَدَى خَلَفٍ وَاشْمِمْ لِخَلَّادٍ الَاوَّلَا'],
    ['عَلَيْهِمْ إِلَيْهِمْ حَمْزَةٌ وَلَدَيْهِمُو','جَمِيعًا بِضَمِّ الْهَاءِ وَقْفًا وَمَوْصِلَا'],
    ['وَصِلْ ضَمَّ مِيمِ الْجَمْعِ قَبْلَ مُحَرَّكٍ','دِرَاكًا وَقَالُونٌ بِتَخْيِيرِهِ جَلَا'],
    ['وَمِنْ قَبْلِ هَمْزِ الْقَطْعِ صِلْهَا لِوَرْشِهِمْ','وَأَسْكَنَهَا الْبَاقُونَ بَعْدُ لِتَكْمُلَا'],
    ['وَمِنْ دُونِ وَصْلٍ ضَمُّهَا قَبْلَ سَاكِنٍ','لِكُلٍّ وَبَعْدَ الْهَاءِ كَسْرُ فَتَى الْعَلَا'],
    ['مَعَ الْكَسْرِ قَبْلَ الْهَا أَوِ الْيَاءِ سَاكِنًا','وَفِي الْوَصْلِ كَسْرُ الْهَاءِ بِالضَّمِّ شَمْلَلَا'],
    ['كَمَا بِهِمُ الْأَسْبَابُ ثُمَّ عَلَيْهِمُ الْـ','ـقِتَالُ وَقِفْ لِلْكُلِّ بِالْكَسْرِ مُكْمِلَا'],
  ],
  u8:[
    ['وَدُونَكَ الِادْغَامَ الْكَبِيرَ وَقُطْبُهُ','أَبُو عَمْرٍو الْبَصْرِيُّ فِيهِ تَحَفَّلَا'],
    ['فَفِي كِلْمَةٍ عَنْهُ مَنَاسِكَكُمْ وَمَا','سَلَكَكُّمْ وَبَاقِي الْبَابِ لَيْسَ مُعَوَّلَا'],
    ['وَمَا كَانَ مِنْ مِثْلَيْنِ فِي كِلْمَتَيْهِمَا','فَلَا بُدَّ مِنْ إِدْغَامِ مَا كَانَ أَوَّلَا'],
    ['كَيَعْلَمُ مَا فِيهِ هُدًى وَطُبِعْ عَلَى','قُلُوبِهِمُ وَالْعَفْوَ وَأْمُرْ تَمَثَّلَا'],
    ['إِذَا لَمْ يَكُنْ تَا مُخْبِرٍ أَوْ مُخَاطَبٍ','أَوِ الْمُكْتَسِي تَنْوِينَهُ أَوْ مُثَقَّلَا'],
    ['كَكُنْتُ تُرَابًا أَنْتَ تُكْرِهُ وَاسِعٌ','عَلِيمٌ وَأَيْضًا تَمَّ مِيقَاتُ مُثِّلَا'],
  ],
  u10:[
    ['إِذَا أَلِفٌ أَوْ يَاؤُهَا بَعْدَ كَسْرَةٍ','أَوِ الْوَاوُ عَنْ ضَمٍّ لَقِي الْهَمْزَ طُوِّلَا'],
    ['فَإِنْ يَنْفَصِلْ فَالْقَصْرُ بَادِرْهُ طَالِبًا','بِخُلْفِهِمَا يُرْوِيكَ دَرًّا وَمُخْضَلَا'],
    ['كَجِيءَ وَعَنْ سُوءٍ وَشَاءَ اتِّصَالُهُ','وَمَفْصُولُهُ فِي أُمِّهَا أَمْرُهُ إِلَى'],
    ['وَمَا بَعْدَ هَمْزٍ ثَابِتٍ أَوْ مُغَيَّرٍ','فَقَصْرٌ وَقَدْ يُرْوَى لِوَرْشٍ مُطَوَّلَا'],
    ['وَوَسَّطَهُ قَوْمٌ كَآمَنَ هَؤُلَا','ءِ آلِهَةً آتَى لِلْإِيمَانِ مُثِّلَا'],
    ['سِوَى يَاءِ إِسْرَائِيلَ أَوْ بَعْدَ سَاكِنٍ','صَحِيحٍ كَقُرْآنٍ وَمَسْئُولًا اسْأَلَا'],
    ['وَمَا بَعْدَ هَمْزِ الْوَصْلِ ايتِ وَبَعْضُهُمْ','يُؤَاخِذُكُمْ آلَانَ مُسْتَفْهِمًا تَلَا'],
    ['وَعَادًا الُاولَى وَابْنُ غَلْبُونَ طَاهِرٌ','بِقَصْرِ جَمِيعِ الْبَابِ قَالَ وَقَوَّلَا'],
    ['وَعَنْ كُلِّهِمْ بِالْمَدِّ مَا قَبْلَ سَاكِنٍ','وَعِنْدَ سُكُونِ الْوَقْفِ وَجْهَانِ أُصِّلَا'],
    ['وَمُدَّ لَهُ عِنْدَ الْفَوَاتِحِ مُشْبِعًا','وَفِي عَيْنٍ الْوَجْهَانِ وَالطُّولُ فُضِّلَا'],
    ['وَفِي نَحْوِ طَهَ الْقَصْرُ إِذْ لَيْسَ سَاكِنٌ','وَمَا فِي أَلِفْ مِنْ حَرْفِ مَدٍّ فَيُمْطَلَا'],
    ['وَإِنْ تَسْكُنِ الْيَا بَيْنَ فَتْحٍ وَهَمْزَةٍ','بِكِلْمَةٍ أَوْ وَاوٌ فَوَجْهَانِ جُمِّلَا'],
    ['بِطُولٍ وَقَصْرٍ وَصْلُ وَرْشٍ وَوَقْفُهُ','وَعِنْدَ سُكُونِ الْوَقْفِ لِلْكُلِّ أُعْمِلَا'],
    ['وَعَنْهُمْ سُقُوطُ الْمَدِّ فِيهِ وَوَرْشُهُمْ','يُوَافِقُهُمْ فِي حَيْثُ لَا هَمْزَ مُدْخَلَا'],
    ['وَفِي وَاوِ سَوْءَاتٍ خِلَافٌ لِوَرْشِهِمْ','وَعَنْ كُلٍّ الْمَوْءُودَةُ اقْصُرْ وَمَوْئِلَا'],
  ],
  u11:[

/* ===== أدوات ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a,n,excl=[]){return shuffle(a.filter(x=>!excl.includes(x))).slice(0,n)}
function names(ids){const n=ids.map(label);return n.length<2?n[0]:n.slice(0,-1).join('، ')+' و'+n[n.length-1]}
function norm(s){return (s||'').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'').replace(/[^\u0621-\u064Aa-zA-Z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}

/* تحويل نص أسماء إلى مجموعة معرفات */
const ALIASES = [
  ['الكوفيون',KUFI],['الكوفيين',KUFI],['الكوفي',KUFI],
  ['دوري ابي عمرو',['duri_a']],['دوري الكسايي',['duri_k']],
  ['ابن كثير',['ibnkathir']],['المكي',['ibnkathir']],['ابو عمرو',['abuamr']],['ابوعمرو',['abuamr']],['البصري',['abuamr']],
  ['ابن عامر',['ibnamir']],['الشامي',['ibnamir']],['اليحصبي',['ibnamir']],['ابن ذكوان',['ibndhakwan']],['ابو الحارث',['abulharith']],
  ['نافع',['nafi']],['المدني',['nafi']],['عاصم',['asim']],['حمزه',['hamza']],['الكسايي',['kisai']],['كسايي',['kisai']],
  ['قالون',['qalun']],['ورش',['warsh']],['البزي',['bazzi']],['قنبل',['qunbul']],['الدوري',['duri']],['السوسي',['susi']],
  ['هشام',['hisham']],['شعبه',['shuba']],['حفص',['hafs']],['خلف',['khalaf']],['خلاد',['khallad']],
].map(([a,ids])=>[norm(a).split(' '),ids]).sort((x,y)=>y[0].length-x[0].length);
function parseNames(text){
  const t=norm(text).split(' ').filter(Boolean);const out=new Set();let i=0;
  while(i<t.length){let hit=false;
    for(const [al,ids] of ALIASES){
      for(const strip of [false,true]){
        const first=strip?(t[i].startsWith('و')?t[i].slice(1):null):t[i];
        if(first===null)continue;
        const seg=[first,...t.slice(i+1,i+al.length)];
        if(seg.length===al.length&&seg.every((w,k)=>w===al[k])){ids.forEach(x=>out.add(x));i+=al.length;hit=true;break}
      }
      if(hit)break;
    }
    if(!hit)i++;
  }
  return out;
}
function sameSet(a,b){a=[...a];b=[...b];return a.length===b.length&&a.every(x=>b.includes(x))}
function setMatches(text,ids){
  const got=parseNames(text);
  const want=new Set(ids.map(x=>x.startsWith('duri')?x:x));
  // الدوري العامة تقبل عن أي دوري
  if(got.has('duri')){got.delete('duri');for(const d of ['duri_a','duri_k'])if(want.has(d)&&!got.has(d)){got.add(d);break}}
  return sameSet(got,want);
}

    ['u10-alif','لفظ «ألف» في الفواتح:','لا يُمد مطلقاً',['الإشباع','القصر','التوسط'],'ليس وسطه حرف مد ولا لين.','ص ١٠٩'],
    ['u10-nqs','حروف «نقص عسلكم» في الفواتح:','الإشباع ست حركات',['القصر','التوسط','لا تُمد'],'ما كان هجاؤه ثلاثة أحرف وسطها حرف مد.','ص ١٠٩'],
    ['u10-arid','المد العارض للسكون:','القصر والتوسط والطول لجميع القراء',['الطول لورش فقط','القصر فقط','التوسط فقط'],'«وعند سكون الوقف وجهان أُصّلا» والقصر ثابت.','ص ١٠٨'],
    ['u10-lin-warsh','مد اللين المهموز (شيء، سوء) لورش:','التوسط والطول وصلاً ووقفاً',['القصر','ثلاثة أوجه وصلاً','التوسط وقفاً فقط'],'«بطول وقصر وصل ورش ووقفه» حسب الشرح في الملف.','ص ١١٠'],
    ['u10-lin-rest','مد اللين المهموز للباقين:','القصر وصلاً، والثلاثة وقفاً',['التوسط وصلاً','الطول وصلاً ووقفاً','لا مد فيه أبداً'],'وقفاً يلحق بالعارض للسكون.','ص ١١٠'],
    ['u10-mawuda','«الموءودة» و«موئلا» لورش:','القصر بلا خلاف',['التوسط والطول','الطول فقط','ثلاثة أوجه'],'«وعن كلٍّ الموءودة اقصر وموئلا».','ص ١١١'],
    ['u10-sawat','«سوءات» لورش:','خلاف بين التوسط والقصر',['القصر بلا خلاف','الطول فقط','الإشباع'],'«وفي واو سوءات خلاف لورشهم».','ص ١١١'],
  ];
  u10.forEach(([id,p,c,w,e,r])=>MC(id,'u10',p,c,w,e,r));

  /* --- الوحدة ١١ و١٢: الفرش --- */
  const u11=[
    ['u11-yakhdaun','من قرأ «وما يَخْدَعون إلا أنفسهم»؟','الكوفيون وابن عامر',['أهل سما','الكوفيون فقط','نافع وابن عامر'],'ذ = الكوفيون وابن عامر.','ص ١١٤'],
    ['u11-yakhdaun-first','«يخادعون الله» (الموضع الأول):','بالألف لجميع القراء',['بلا ألف للكوفيين','بلا ألف لجميع القراء','بلا ألف لأهل سما'],'«والغير كالحرف أولا».','ص ١١٤'],
    ['u11-yakdhibun','من قرأ «يَكْذِبون» بالتخفيف وفتح الياء؟','الكوفيون',['أهل سما','ابن عامر وحده','الكوفيون وابن عامر'],'«وخفف كوف يكذبون».','ص ١١٥'],
    ['u11-qila','من قرأ بإشمام «قيل، وغيض، وجيء»؟','الكسائي وهشام',['ابن عامر والكسائي','الكسائي ونافع','هشام وحده'],'ر = رجال، ل = لتكملا.','ص ١١٦'],
    ['u11-hila','من قرأ بإشمام «وحيل، وسيق»؟','ابن عامر والكسائي',['الكسائي وهشام','نافع وابن عامر والكسائي','الكسائي وحده'],'«كما رسا»: ك ابن عامر، ر الكسائي.','ص ١١٦'],
    ['u11-sia','من قرأ بإشمام «سيء، وسيئت»؟','ابن عامر والكسائي ونافع',['الكسائي وهشام','ابن عامر والكسائي','نافع وحده'],'«كان راويه أنبلا».','ص ١١٦'],
    ['u11-ishmam','كيفية الإشمام في هذه الأفعال:','حركة مركبة من ضمة وكسرة',['ضم الشفتين بعد السكون','إسكان الحرف الأول','صوت بين الصاد والزاي'],'تحرك الحرف الأول بحركة مركبة من حركتين.','ص ١١٦'],
    ['u11-huwa','من قرأ بإسكان هاء «هو، هي» بعد الواو والفاء واللام؟','الكسائي وقالون وأبو عمرو',['الكسائي وقالون','حمزة والكسائي','قالون وحده'],'«راضياً بارداً حلا».','ص ١١٧'],
    ['u11-thumma','من قرأ بإسكان الهاء في «ثم هو يوم القيامة»؟','الكسائي وقالون',['الكسائي وقالون وأبو عمرو','أبو عمرو وحده','حمزة'],'«وثم هو رفقاً بان».','ص ١١٧'],
    ['u11-yumill','«أن يُمِلّ هو» في البقرة:','بضم الهاء لجميع القراء',['بالإسكان للكسائي','بالإسكان لقالون','وجهان'],'«وعن كل يمل هو انجلى».','ص ١١٧'],
  ];
  u11.forEach(([id,p,c,w,e,r])=>MC(id,'u11',p,c,w,e,r));
  const u12=[
    ['u12-azalla','من قرأ «فأزالهما»؟','حمزة',['الكسائي','حمزة والكسائي','ابن كثير'],'«وفي فأزل اللام خفف لحمزة».','ص ١٢٤'],
    ['u12-tawjih','توجيه «فأزالهما» و«فأزلّهما»:','أزالهما من الزوال، وأزلّهما من الزلل',['أزالهما من الزلل، وأزلّهما من الزوال','كلاهما من الزلل','كلاهما من الزوال'],'هذا توجيه القراءتين.','ص ١٢٤'],
    ['u12-adam','قرأ ابن كثير:','بنصب «آدمَ» ورفع «كلماتٌ»',['برفع «آدمُ» ونصب «كلماتٍ»','برفعهما','بنصبهما'],'«وللمكي عكس تحولا».','ص ١٢٥'],
    ['u12-adam-why','توجيه رفع «آدم»:','على أنه فاعل',['على أنه مفعول به','على أنه مبتدأ','على أنه بدل'],'وبالنصب على أنه مفعول به.','ص ١٢٥'],
    ['u12-tuqbal','من قرأ «ولا تُقبل منها شفاعة» بالتأنيث؟','ابن كثير وأبو عمرو',['أبو عمرو وحده','نافع وابن كثير','الكوفيون'],'«دون حاجز»: د ابن كثير، ح أبو عمرو.','ص ١٢٦'],
    ['u12-adl','«ولا يقبل منها عدل»:','بالتذكير لجميع القراء',['بالتأنيث لابن كثير','بالتأنيث لأبي عمرو','وجهان'],'التقييد بالأولى للاحتراز عن الثانية.','ص ١٢٦'],
    ['u12-waadna','من قرأ «وعدنا» بلا ألف؟','أبو عمرو',['ابن كثير وأبو عمرو','حمزة','الكسائي'],'«وعدنا جميعاً دون ما ألف حلا».','ص ١٢٦'],
    ['u12-waadna-n','في كم موضعاً وردت «واعدنا» المختلف فيها؟','ثلاثة: البقرة والأعراف وطه',['موضعان','أربعة','موضع واحد'],'وإذ واعدنا موسى، وواعدنا موسى ثلاثين، وواعدناكم جانب الطور.','ص ١٢٦'],
  ];
  u12.forEach(([id,p,c,w,e,r])=>MC(id,'u12',p,c,w,e,r));

  /* --- أسئلة الشاهد --- */
  SHAHID.forEach(s=>add({...s,type:'shahid',prompt:'استخرجي الخريطة من البيت'}));
  return B;
}

/* ===== بطاقات التعلّم ===== */
function buildCards(unit){
  if(unit==='u2')return [...READERS.map(r=>({f:r.sym,b:r.name+' — قارئ'})),...RAWIS.map(w=>({f:w.sym,b:label(w.id)+' — راوي '+ALL[w.of].name})),...READERS.map(r=>({f:r.word,b:r.sym+' '+r.name+' · '+r.rawis.map(x=>ALL[x].sym+' '+label(x)).join(' · ')}))];
  if(unit==='u3')return GROUPS.map(g=>({f:g.sym,b:g.desc}));
  if(unit==='u1')return [...READERS.map(r=>({f:r.name,b:`${r.full} · ${r.nisba} · راوياه: ${names(r.rawis)} (${r.via})`})),...RAWIS.filter(w=>w.id!=='duri_k').map(w=>({f:w.name,b:`${w.full} · راوي ${ALL[w.of].name}`})),{f:'الشاطبي',b:'أبو محمد القاسم بن فيره · وُلد ضريراً ٥٣٨هـ بشاطبة (شرق الأندلس) · توفي بالقاهرة ٥٩٠هـ · شيخه النفزي · عرض التيسير في بلنسية'}];
  const B=buildBank().filter(q=>q.unit===unit&&q.type==='mcq'&&!q.verseOpts&&!q.fixed);
  const cards=B.map(q=>({f:q.prompt,b:q.correct}));
  return cards;
}
if(typeof module!=='undefined')module.exports={buildBank,buildCards,norm,parseNames,setMatches,UNITS,SHAHID,GROUPS,READERS,RAWIS,ALL};

</script>
<script>
/* ===== الحالة والتخزين ===== */
const KEY='hirz-v1';
let S={q:{},flags:[],last:null,nick:'',dev:''};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const BANK=buildBank();
const BYID={};BANK.forEach(q=>BYID[q.id]=q);
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

function rec(id,ok){
  const r=S.q[id]||{c:0,w:0,box:0};
  if(ok){r.c++;r.box=Math.min(5,r.box+1)}else{r.w++;r.box=0}
  r.t=Date.now();S.q[id]=r;save();
  scheduleSubmit();
}
let _st=null;
function scheduleSubmit(){if(!S.nick)return;clearTimeout(_st);_st=setTimeout(()=>submitScore(),2500)}
function mastery(unit){
  const qs=BANK.filter(q=>!unit||q.unit===unit);
  const sum=qs.reduce((a,q)=>a+Math.min(3,(S.q[q.id]||{}).box||0),0);
  return Math.round(100*sum/(3*qs.length));
}
function diff(q){
  if(q.type==='shahid'||q.type==='text')return 3;
  if(q.type==='multi')return 2;
  if(q.options&&q.options[0]==='صح'||/^(u2-s2n|u2-n2s|u2-of|u3-s2m|u3-m2s|u1-nisba|u1-via)/.test(q.id))return 1;
  return 2;
}
const LEVELS=[['mix','منوّع'],['1','سهل'],['2','متوسط'],['3','صعب']];
const LEVEL_HINT={mix:'من كل المستويات',1:'اختيار من متعدد مباشر وصح أو خطأ',2:'أسئلة الأبواب والأحكام واختيار أكثر من إجابة',3:'كتابة الإجابة بنفسك، والشاهد والخريطة'};
const mistakes=()=>BANK.filter(q=>{const r=S.q[q.id];return r&&r.w>0&&r.box<3});

/* اختيار الأسئلة: الأضعف أولاً */
function priority(q){
  const r=S.q[q.id];
  if(!r)return 1+Math.random();
  if(r.w>0&&r.box===0)return Math.random()*.8;
  return 1.2+r.box+Math.random()*1.5;
}
function selectQs(pool,n){return pool.map(q=>[priority(q),q]).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1]).sort(()=>Math.random()-.5)}

/* ===== التنقل ===== */
let view=null, timerId=null;
function go(fn,...args){clearInterval(timerId);view=[fn,args];fn(...args);window.scrollTo(0,0)}
function hdr(back){return `<div class="top"><button class="brand" onclick="go(home)" aria-label="الرئيسية">حِرز</button>${back?`<button class="back" onclick="${back}">رجوع</button>`:''}</div>`}
const ded='';

function verseHtml(v,cls='bayt'){
  // يلوّن أوائل الكلمات المعروفة كرموز
  return `<div class="${cls}"><span class="h">${v[0]}</span><span class="h">${v[1]}</span></div>`;
}
function heroVerse(){
  const s=SHAHID[Math.floor(Math.random()*SHAHID.length)];
  const line=s.lines[s.lines.length===1?0:Math.floor(Math.random()*s.lines.length)];
  const fmt=t=>t.replace(/\{([^}]+)\}/g,(m,w)=>`<span class="r">${w}</span>`);
  return `<div class="bayt"><span class="h">${fmt(line[0])}</span><span class="h">${fmt(line[1])}</span></div>`;
}

/* ===== الرئيسية ===== */
function home(){
  const m=mistakes().length, total=mastery();
  const seen=Object.keys(S.q).length;
  app.innerHTML=`
  <div class="hero">
    <h1>حِرز <span>الشاطبية</span></h1>
    <p>تدريب على الرموز والأبواب، من ملف المقرر نفسه.</p>
    ${heroVerse()}
  </div>
  <div class="actions">
    <button class="btn main" onclick="go(practiceSetup,'all')">تدريب عام <small>${seen?`الإتقان ${AR(total)}٪`:'كل المنهج، بالعدد والصعوبة'}</small></button>
    <button class="btn" onclick="go(examSetup,'all')">اختبار شامل <small>كل الملف</small></button>
    <button class="btn" onclick="go(runSession,{scope:'mistakes',mode:'practice'})" ${m?'':'disabled style="opacity:.55"'}>أخطائي <span class="pill">${AR(m)}</span></button>
    <button class="btn" onclick="go(lbView)">المتصدرات <small>تنافسي مع صديقاتك</small></button>
    <button class="btn" onclick="go(reference)">المرجع السريع <small>الجداول والأضداد</small></button>
  </div>
  <h2>الوحدات</h2>
  <div class="units">${UNITS.map((u,i)=>{const p=mastery(u.id);return `
    <button class="unit" onclick="go(unitView,'${u.id}')">
      <span class="n">${AR(i+1)}</span>
      <span><span class="t">${u.title}</span><span class="p"> · ${u.pages}</span><div class="bar"><i style="width:${p}%"></i></div></span>
      <span class="pct">${AR(p)}٪</span>
    </button>`}).join('')}</div>
  ${S.flags.length?`<div class="row"><button class="ghost" onclick="go(flagsView)">ملاحظاتي على الأسئلة (${AR(S.flags.length)})</button></div>`:''}
  ${ded}`;
}

/* ===== الوحدة ===== */
function unitView(uid){
  const u=UNITS.find(x=>x.id===uid), qs=BANK.filter(q=>q.unit===uid);
  const hasSh=qs.some(q=>q.type==='shahid');
  app.innerHTML=`${hdr('go(home)')}
  <div class="unit-head"><p>${u.pages} · ${AR(qs.length)} سؤالاً</p><h1>${u.title}</h1></div>
  <div class="bar" style="margin:12px 0 4px"><i style="width:${mastery(uid)}%"></i></div>
  <div class="modes">
    <button class="mode" onclick="go(learn,'${uid}')"><b>تعلّم</b><span>بطاقات تقلبينها للحفظ، بلا تسجيل</span></button>
    <button class="mode" onclick="go(practiceSetup,'${uid}')"><b>تدريب</b><span>تختارين العدد والصعوبة، والتصحيح فوري</span></button>
    ${hasSh?`<button class="mode" onclick="go(runSession,{scope:'${uid}',mode:'practice',only:'shahid'})"><b>الشاهد والخريطة</b><span>البيت ← اللفظ والقراء والشاهد والباقون</span></button>`:''}
    <button class="mode" onclick="go(examSetup,'${uid}')"><b>اختبار</b><span>بدون تصحيح حتى النهاية، مع مؤقت اختياري</span></button>
  </div>${ded}`;
}

/* ===== التعلّم ===== */
function learn(uid){
  const cards=shuffle(buildCards(uid));let i=0,flipped=false;
  const isSym=c=>uid==='u2'||uid==='u3'?c.f.length<=5:false;
  function draw(){
    const c=cards[i];
    app.innerHTML=`${hdr(`go(unitView,'${uid}')`)}
    <div class="qmeta"><span>تعلّم · ${UNITS.find(u=>u.id===uid).title}</span><span>${AR(i+1)} / ${AR(cards.length)}</span></div>
    <div class="flash"><div class="fc" id="fc" role="button" tabindex="0" aria-label="اقلبي البطاقة">
      <div>${flipped?`<div class="bk ${c.verse?'v':''}">${esc(c.b)}</div><div class="lbl">${esc(c.f)}</div>`
        :`<div class="front ${isSym(c)?'sym':''} ${c.verse?'v':''}">${esc(c.f)}</div><div class="lbl">اضغطي للقلب</div>`}</div>
    </div></div>
    <div class="row"><button class="ghost" id="prev">السابقة</button><button class="go" id="next">التالية</button></div>`;
    $('#fc').onclick=$('#fc').onkeydown=e=>{if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;flipped=!flipped;draw()};
    $('#next').onclick=()=>{i=(i+1)%cards.length;flipped=false;draw()};
    $('#prev').onclick=()=>{i=(i-1+cards.length)%cards.length;flipped=false;draw()};
  }
  draw();
}

/* ===== الجلسات ===== */
function poolFor(opts){
  let pool=opts.ids?opts.ids.map(id=>BYID[id]).filter(Boolean):opts.scope==='all'?BANK:opts.scope==='mistakes'?mistakes():BANK.filter(q=>q.unit===opts.scope);
  if(opts.only)pool=pool.filter(q=>q.type===opts.only);
  if(opts.level&&opts.level!=='mix')pool=pool.filter(q=>diff(q)===+opts.level);
  return pool;
}
function practiceSetup(scope){
  let n=20,level='mix';
  const back=scope==='all'?'go(home)':`go(unitView,'${scope}')`;
  function draw(){
    const avail=l=>poolFor({scope,level:l}).length;
    app.innerHTML=`${hdr(back)}
    <div class="unit-head"><p>تدريب</p><h1>${scope==='all'?'تدريب عام على كل المنهج':UNITS.find(u=>u.id===scope).title}</h1></div>
    <h2>مستوى الصعوبة</h2><div class="seg">${LEVELS.map(([k,t])=>`<button class="${k===level?'on':''}" data-l="${k}" ${avail(k)?'':'disabled style="opacity:.4"'}>${t} <small>(${AR(avail(k))})</small></button>`).join('')}</div>
    <p class="hint" style="text-align:right;margin-top:0">${LEVEL_HINT[level]}</p>
    <h2>عدد الأسئلة</h2><div class="seg">${[10,20,40].map(k=>`<button class="${k===n?'on':''}" data-n="${k}">${AR(k)}</button>`).join('')}<button class="${n===0?'on':''}" data-n="0">الكل</button></div>
    <p class="hint" style="text-align:right">التصحيح فوري، وفي النهاية تقدرين تعيدين أخطاء الجلسة.</p>
    <div class="row"><button class="go" id="start">ابدئي التدريب</button></div>`;
    app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{level=b.dataset.l;draw()});
    app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{n=+b.dataset.n;draw()});
    $('#start').onclick=()=>{const total=avail(level);go(runSession,{scope,mode:'practice',level,n:n===0?total:Math.min(n,total)})};
  }
  draw();
}
function examSetup(scope){
  let n=20,timed=false,level='mix';
  const back=scope==='all'?'go(home)':`go(unitView,'${scope}')`;
  function draw(){
    const avail=l=>poolFor({scope,level:l}).length;
    app.innerHTML=`${hdr(back)}
    <div class="unit-head"><p>اختبار</p><h1>${scope==='all'?'اختبار شامل':UNITS.find(u=>u.id===scope).title}</h1></div>
    <h2>مستوى الصعوبة</h2><div class="seg">${LEVELS.map(([k,t])=>`<button class="${k===level?'on':''}" data-l="${k}" ${avail(k)?'':'disabled style="opacity:.4"'}>${t} <small>(${AR(avail(k))})</small></button>`).join('')}</div>
    <h2>عدد الأسئلة</h2><div class="seg">${[10,20,40].map(k=>`<button class="${k===n?'on':''}" data-n="${k}">${AR(k)}</button>`).join('')}</div>
    <h2>المؤقت</h2><div class="seg"><button class="${!timed?'on':''}" data-t="0">بدون</button><button class="${timed?'on':''}" data-t="1">دقيقة لكل سؤال</button></div>
    <p class="hint" style="text-align:right">لن يظهر التصحيح حتى تنتهي، ثم تراجعين كل سؤال.</p>
    <div class="row"><button class="go" id="start">ابدئي الاختبار</button></div>`;
    app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{n=+b.dataset.n;draw()});
    app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{timed=b.dataset.t==='1';draw()});
    app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{level=b.dataset.l;draw()});
    $('#start').onclick=()=>go(runSession,{scope,mode:'exam',level,n:Math.min(n,avail(level)),timed});
  }
  draw();
}

function runSession(opts){
  const pool=poolFor(opts);
  if(!pool.length){app.innerHTML=`${hdr('go(home)')}<div class="empty">لا توجد أسئلة هنا الآن. ${opts.scope==='mistakes'?'لا أخطاء محفوظة، أحسنتِ.':''}</div>`;return}
  const n=Math.min(opts.n||15,pool.length);
  let queue=selectQs(pool,n), idx=0, log=[], deadline=opts.timed?Date.now()+n*60000:null;
  const exam=opts.mode==='exam';
  const back=opts.scope==='all'||opts.scope==='mistakes'?'go(home)':`go(unitView,'${opts.scope}')`;
  const title=opts.scope==='all'?'كل الوحدات':opts.scope==='mistakes'?'أخطائي':UNITS.find(u=>u.id===opts.scope).title;
  if(deadline){timerId=setInterval(()=>{const el=$('#timer');const left=deadline-Date.now();if(left<=0){clearInterval(timerId);finish();return}if(el)el.textContent=AR(Math.floor(left/60000))+':'+AR(String(Math.floor(left%60000/1000)).padStart(2,'0'))},1000)}

  function next(){idx++; if(idx>=queue.length)finish(); else draw()}
  function draw(){
    const q=queue[idx];
    app.innerHTML=`${hdr(back)}
    <div class="qmeta"><span>${exam?'اختبار':'تدريب'} · ${title}</span><span>${deadline?`<span class="timer" id="timer"></span> · `:''}${AR(idx+1)} / ${AR(queue.length)}</span></div>
    <div class="progress"><i style="width:${100*idx/queue.length}%"></i></div>
    <div class="qcard" id="qc"></div>
    <button class="flag" onclick="flagQ('${q.id}')">في هذا السؤال خطأ؟</button>`;
    renderQ(q,$('#qc'),{exam,onDone:(ok,given)=>{
      log.push({q,ok,given});
      if(ok!==null)rec(q.id,ok===true);
      if(exam)next();
    },onNext:next});
  }
  function finish(){
    clearInterval(timerId);
    results(log,exam,opts,back);
  }
  draw();
}

/* ===== عرض السؤال ===== */
function renderQ(q,el,{exam,onDone,onNext}){
  if(q.type==='shahid')return renderShahid(q,el,{exam,onDone,onNext});
  const fb=(ok,extra='')=>exam?'':`<div class="fb ${ok?'ok':'no'}"><b>${ok?'صحيح · +١ نقطة':'غير صحيح'}</b>${extra}${esc(q.explain||'')}<div class="ref">${esc(q.ref||'')}</div></div><div class="row"><button class="go" id="nx">التالي</button></div>`;
  const head=`${q.big&&q.prompt.includes('«')?`<div class="symbig">${esc(q.prompt.match(/«([^»]+)»/)[1])}</div>`:''}<p class="prompt">${esc(q.prompt)}</p>${q.verse?`<div class="qverse">${esc(q.verse)}</div>`:''}`;
  if(q.type==='mcq'){
    const opts=q.fixed?q.options:shuffle(q.options);
    el.innerHTML=`${head}<div class="opts ${q.options.length===2&&q.options[0]==='صح'?'tf':''}">${opts.map((o,i)=>`<button class="opt ${q.verseOpts?'verse':''}" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="fbx"></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const pickd=opts[+b.dataset.i], ok=pickd===q.correct;
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(!exam){if(opts[+x.dataset.i]===q.correct)x.classList.add('ok')}});
      if(!exam&&!ok)b.classList.add('no'); if(exam)b.classList.add('sel');
      onDone(ok,pickd);
      if(!exam){$('#fbx').innerHTML=fb(ok);$('#nx').onclick=onNext;$('#nx').focus()}
    });
  }else if(q.type==='multi'){
    const opts=shuffle(q.options),sel=new Set();
    el.innerHTML=`${head}<p class="hint" style="text-align:right;margin-top:-8px">اختاري كل الإجابات الصحيحة ثم «تحقّقي»</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${esc(o)}</button>`).join('')}</div><div class="row"><button class="go" id="chk">تحقّقي</button></div><div id="fbx"></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=opts[+b.dataset.i];sel.has(v)?sel.delete(v):sel.add(v);b.classList.toggle('sel');b.setAttribute('aria-pressed',sel.has(v))});
    $('#chk').onclick=()=>{
      const ok=sameSet(sel,q.correct);
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const v=opts[+x.dataset.i];if(!exam){x.classList.remove('sel');if(q.correct.includes(v))x.classList.add('ok');else if(sel.has(v))x.classList.add('no')}});
      $('#chk').remove();onDone(ok,[...sel].join('، '));
      if(!exam){$('#fbx').innerHTML=fb(ok);$('#nx').onclick=onNext}
    };
  }else if(q.type==='text'){
    el.innerHTML=`${head}<input type="text" id="ans" autocomplete="off" placeholder="اكتبي هنا"><div class="row"><button class="go" id="chk">تحقّقي</button></div><div id="fbx"></div>`;
    const inp=$('#ans');inp.focus();
    inp.onkeydown=e=>{if(e.key==='Enter')$('#chk').click()};
    $('#chk').onclick=()=>{
      const v=inp.value.trim(); if(!v){inp.focus();return}
      const ok=checkText(q,v);
      inp.disabled=true; $('#chk').remove();
      if(exam){onDone(ok,v);return}
      inp.classList.add(ok?'ok':'no');
      $('#fbx').innerHTML=fb(ok,ok?'':`<div>الإجابة: <b style="display:inline">${esc(q.model)}</b></div>`)+(ok?'':`<button class="flag" id="ovr">إجابتي صحيحة بصيغة أخرى</button>`);
      let done=false;const fin=r=>{if(done)return;done=true;onDone(r,v)};
      $('#nx').onclick=()=>{fin(ok);onNext()};
      if(!ok)$('#ovr').onclick=()=>{fin(true);onNext()};
    };
  }
}
function checkText(q,v){
  if(q.mode==='exact')return q.accept.some(a=>norm(a)===norm(v));
  if(q.special&&q.special.some(s=>norm(v).includes(norm(s))))return true;
  return setMatches(v,q.ids);
}

/* ===== الشاهد ===== */
function renderShahid(q,el,{exam,onDone,onNext}){
  // تقطيع البيت إلى كلمات قابلة للنقر
  let k=0;const targets=new Set();
  const lineHtml=line=>line.map(half=>`<span class="half">${
    half.split(/(\{[^}]+\}|\s+)/).filter(s=>s&&!/^\s+$/.test(s)).map(w=>{
      const t=w.startsWith('{');const txt=t?w.slice(1,-1):w;const id=k++;if(t)targets.add(id);
      return `<button class="tok" data-k="${id}">${txt}</button>`}).join(' ')}</span>`).join('');
  const verses=q.lines.map(l=>`<div class="sh-verse">${lineHtml(l)}</div>`).join('');
  const readerChips=READERS.map(r=>[r.id,...r.rawis]).flat();
  el.innerHTML=`<p class="prompt">استخرجي الخريطة من البيت</p>${verses}
  <p class="hint">المسي الكلمات التي فيها رمز أو اسم القارئ</p>
  <div class="field"><label for="w">اللفظ القرآني المختلف فيه</label><input type="text" id="w" autocomplete="off"></div>
  <div class="field"><label>المرموز لهم أو المصرّح بأسمائهم (لا تختاري الباقين)</label>
    <div class="chips">${readerChips.map(id=>`<button class="chip ${ALL[id].rawis?'reader':''}" data-id="${id}">${label(id)}</button>`).join('')}</div></div>
  <div class="field"><label for="sh">الشاهد</label><textarea id="sh" placeholder="اكتبي موضع الشاهد من البيت"></textarea></div>
  <div class="field"><label for="ra">وجه قراءة المرموز لهم</label><textarea id="ra"></textarea></div>
  <div class="field"><label for="rb">قراءة الباقين</label><textarea id="rb"></textarea></div>
  <div class="row"><button class="go" id="chk">تحقّقي</button></div><div id="res"></div>`;
  const tsel=new Set(), csel=new Set();
  el.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{const id=+b.dataset.k;tsel.has(id)?tsel.delete(id):tsel.add(id);b.classList.toggle('on')});
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const id=b.dataset.id;csel.has(id)?csel.delete(id):csel.add(id);b.classList.toggle('on')});
  $('#chk').onclick=()=>{
    const who=q.groups.flatMap(g=>g.who);
    const wv=$('#w').value, shv=$('#sh').value;
    const part={
      word: q.accept.some(a=>{const A=norm(a),V=norm(wv);return V&&(A===V||V.includes(A)||A.includes(V)&&V.length>=4)}),
      toks: sameSet(tsel,targets),
      who: sameSet(csel,who),
      shahid: (()=>{const A=norm(q.shahid),V=norm(shv);if(!V)return false;if(A===V)return true;const aw=A.split(' '),vw=new Set(V.split(' '));return aw.filter(w=>vw.has(w)).length/aw.length>=.85})(),
      read:null
    };
    // إظهار التصحيح على البيت والأزرار
    el.querySelectorAll('.tok').forEach(b=>{b.disabled=true;const id=+b.dataset.k;b.classList.remove('on');if(targets.has(id))b.classList.add(tsel.has(id)?'right':'miss');else if(tsel.has(id))b.classList.add('extra')});
    el.querySelectorAll('.chip').forEach(b=>{b.disabled=true;const id=b.dataset.id;if(who.includes(id))b.classList.add(csel.has(id)?'on':'ok');else if(csel.has(id)){b.classList.remove('on');b.classList.add('no')}});
    ['w','sh','ra','rb'].forEach(i=>$('#'+i).disabled=true);
    $('#w').classList.add(part.word?'ok':'no');$('#sh').classList.add(part.shahid?'ok':'no');
    $('#chk').remove();
    const tick=v=>v?'<span class="mark">✓</span>':'<span class="mark" style="color:var(--wrong)">✗</span>';
    $('#res').innerHTML=`
    <div class="map"><h3>الخريطة الصحيحة</h3>
      <div class="root">${esc(q.word)} ${tick(part.word)}</div>
      <div class="branches">
        ${q.groups.map(g=>`<div class="br"><b>${esc(g.reading)}</b>${names(g.who)}<br><small>${esc(g.codes)}</small></div>`).join('')}
        <div class="br sh"><b>الشاهد ${tick(part.shahid)}</b>${esc(q.shahid)}</div>
        <div class="br rest"><b>الباقون</b>${esc(q.rest)}</div>
      </div>
      <p class="hint" style="margin-top:10px">مواضع الرموز ${tick(part.toks)} · القراء ${tick(part.who)}<br><span style="font-size:12px">${esc(q.ref)}</span></p>
      <p class="hint" style="margin:6px 0">قارني كتابتك لوجه القراءة وقراءة الباقين بالخريطة:</p>
      <div class="self"><button data-s="1">كتبتها صح</button><button data-s="0">فيها نقص</button></div>
      ${part.word&&part.shahid?'':'<button class="flag" id="ovr">كتبتُ اللفظ أو الشاهد بصيغة صحيحة أخرى</button>'}
    </div>`;
    if($('#ovr'))$('#ovr').onclick=()=>{part.word=true;part.shahid=true;$('#ovr').remove();$('#w').className='ok';$('#sh').className='ok'};
    el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
      part.read=b.dataset.s==='1';
      const ok=part.word&&part.toks&&part.who&&part.shahid&&part.read;
      el.querySelector('.self').innerHTML=`<div class="fb ${ok?'ok':'no'}" style="margin:0;flex:1"><b>${ok?'الخريطة كاملة · +١ نقطة 🌷':'راجعي ما عليه ✗ ثم أعيديها لاحقاً'}</b></div>`;
      onDone(ok,'خريطة');
      if(!exam){el.insertAdjacentHTML('beforeend','<div class="row"><button class="go" id="nx">التالي</button></div>');$('#nx').onclick=onNext}
    });
  };
}

function results(log,exam,opts,back){
  submitScore();
  const graded=log.filter(l=>l.ok!==null), right=graded.filter(l=>l.ok).length;

  ${(()=>{const w=[...new Set(log.filter(l=>l.ok===false).map(l=>l.q.id))];return w.length?`<div class="row"><button class="go" onclick="go(runSession,${esc(JSON.stringify({scope:opts.scope,mode:'practice',ids:w,n:w.length}))})">أعيدي أخطاء هذه الجلسة (${AR(w.length)})</button></div>`:''})()}

     ${l.q.type==='shahid'?'':`<div class="a">إجابتك: ${esc(l.given||'—')}</div><div>الصحيح: <b>${esc(Array.isArray(l.q.correct)?l.q.correct.join('، '):l.q.correct||l.q.model)}</b></div>`}
     ${l.q.explain?`<div class="a">${esc(l.q.explain)} · ${esc(l.q.ref||'')}</div>`:''}</div>`).join('')}`:''}
  ${ded}`;
}

  const me=list.findIndex(r=>r.name===S.nick);

  app.innerHTML=`${hdr('go(home)')}
  <div class="unit-head"><h1>المتصدرات</h1><p>كل إجابة صحيحة = نقطة · ${AR(rows.length)} مشاركة</p></div>
  <div class="seg"><button class="${sortKey==='correct'?'on':''}" data-k="correct">النقاط</button><button class="${sortKey==='mastery'?'on':''}" data-k="mastery">الإتقان</button></div>
  ${sortKey==='mastery'?`<p class="hint" style="text-align:right;margin:0">يدخل الإتقان بعد ${AR(MIN)} إجابة أو أكثر.</p>`:''}
  ${me>=0?`<div class="mine">ترتيبك: <b>${AR(me+1)}</b> من ${AR(list.length)} · نقاطك: <b>${AR(list[me].correct)}</b></div>`:`<div class="mine">${sortKey==='mastery'?'أجيبي عن ٢٠ سؤالاً لتظهري في هذا الترتيب.':'ابدئي التدريب لتظهري في اللوحة.'}</div>`}
  <div class="lb">${list.length?list.map((r,i)=>`<div class="lbr ${r.name===S.nick?'me':''}"><span class="rk">${i<3?medal[i]:AR(i+1)}</span><span class="nm">${esc(r.name)}<small>إتقان ${AR(r.mastery)}٪ · أجابت ${AR(r.answered)}</small></span><span class="sc">${AR(sortKey==='mastery'?r.mastery+'٪':r.correct)}</span></div>`).join(''):'<div class="empty">لا أحد بعد. كوني الأولى.</div>'}</div>
  <div class="row"><button class="lnk" id="chn">تغيير اسمي (${esc(S.nick)})</button></div>`;
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>lbView(b.dataset.k));
  $('#chn').onclick=()=>nameForm(true);
}

go(home);
</script>
</body>
</html>
