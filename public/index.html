<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6E9D2">
<title>شمّاعة الخلاف المشروخة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6E9D2; --card:#FFF6E3; --ink:#3B2216; --muted:#8A6446; --line:#E3C79C;
  --rose:#C9602A; --rose-soft:#F6DDBF; --mint:#5F8A4A; --mint-soft:#E2EDD6;
  --lav:#A8651F; --lav-soft:#F2E0BC; --ramz:#B5412F; --wrong:#B5412F; --glow:rgba(240,138,60,.22); --stripe:rgba(185,97,37,.07);
  --verse:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  --ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --hand:'Readex Pro','IBM Plex Sans Arabic',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#2A170F; --card:#3A2218; --ink:#F7E6C8; --muted:#D2B28C; --line:#5B3A28; --rose:#F08A3C; --rose-soft:#4A2A1A; --mint:#8FBF74; --mint-soft:#2B3A22; --lav:#E9A23B; --lav-soft:#4A3418; --ramz:#F3B36B; --wrong:#E0816E; --glow:rgba(240,138,60,.42); --stripe:rgba(255,214,160,.05);}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:18px 18px 40px}
a{color:var(--lav)}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* رأس */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-family:var(--hand);font-size:28px;color:var(--rose);line-height:1;background:none;border:0;padding:4px 0;cursor:pointer}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);font-size:15px}

/* البطل */
.hero{padding:26px 4px 8px}
.hero h1{font-family:var(--hand);font-weight:700;font-size:56px;line-height:1.1;margin:0;color:var(--ink)}
.hero h1 span{color:var(--rose)}
.hero p{margin:6px 0 0;color:var(--muted)}
.bayt{font-family:var(--verse);font-size:23px;line-height:2;margin:22px 0 6px;padding:16px 18px;background:var(--card);border-radius:18px;border:1px solid var(--line);text-align:center}
.bayt .h{display:block}
.r{color:var(--ramz)}

/* أزرار رئيسية */
.actions{display:grid;gap:10px;margin:22px 0}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:right;border:0;border-radius:16px;padding:15px 18px;cursor:pointer;font-weight:600;background:var(--card);border:1px solid var(--line)}
.btn small{font-weight:400;color:var(--muted);font-size:14px}
.btn.main{background:var(--rose);color:#fff;border-color:transparent}
.btn.main small{color:#fff;opacity:.85}
.btn:active{transform:scale(.99)}
.pill{display:inline-block;min-width:26px;padding:0 9px;border-radius:999px;background:var(--rose-soft);color:var(--rose);font-size:14px;text-align:center}

/* الوحدات */
h2{font-size:15px;color:var(--muted);font-weight:500;margin:28px 4px 10px}
.units{display:grid;gap:8px}
.unit{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:right;width:100%}
.unit .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--lav-soft);color:var(--lav);font-size:14px;font-weight:600}
.unit .t{font-weight:600}
.unit .p{font-size:13px;color:var(--muted)}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--mint);border-radius:4px}
.pct{font-size:14px;color:var(--mint);font-weight:600;min-width:38px;text-align:left}

/* لوحة الوحدة */
.modes{display:grid;gap:10px;margin-top:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;text-align:right;width:100%}
.mode b{display:block;font-size:18px}
.mode span{color:var(--muted);font-size:14px}
.unit-head h1{font-size:26px;margin:4px 0 0}
.unit-head p{margin:0;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg button[disabled]{cursor:default}
.seg small{font-size:12px;opacity:.75}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* السؤال */
.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:8px}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--rose);transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.prompt{font-size:19px;font-weight:600;margin:0 0 14px}
.prompt.big{font-size:20px}
.symbig{font-family:var(--verse);font-size:56px;color:var(--ramz);text-align:center;line-height:1.3;margin:-4px 0 6px}
.qverse{font-family:var(--verse);font-size:22px;line-height:2;text-align:center;background:var(--lav-soft);border-radius:14px;padding:12px;margin-bottom:14px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;text-align:right;cursor:pointer;line-height:1.6}
.opt.verse{font-family:var(--verse);font-size:20px}
.opt.sel{border-color:var(--lav);background:var(--lav-soft)}
.opt.ok{border-color:var(--mint);background:var(--mint-soft)}
.opt.no{border-color:var(--wrong);background:var(--rose-soft)}
.opt[disabled]{cursor:default}
.tf{grid-template-columns:1fr 1fr}
input[type=text],textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--paper);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input.ok,textarea.ok{border-color:var(--mint)}
input.no,textarea.no{border-color:var(--wrong)}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:16px}
.fb.ok{background:var(--mint-soft)}
.fb.no{background:var(--rose-soft)}
.fb b{display:block}
.fb .ref{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.go{flex:1;border:0;border-radius:14px;padding:13px;background:var(--ink);color:var(--paper);font-weight:600;cursor:pointer}
.ghost{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:transparent;cursor:pointer;color:var(--muted)}
.flag{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:6px 0;margin-top:8px;text-decoration:underline}

/* الشاهد */
.sh-verse{font-family:var(--verse);font-size:21px;line-height:2.1;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 8px;margin-bottom:6px}
.sh-verse .half{display:block}
.tok{background:none;border:0;padding:0 2px;margin:0 1px;border-radius:8px;cursor:pointer;font:inherit;color:inherit}
.tok.on{background:var(--lav-soft);color:var(--lav);box-shadow:inset 0 -2px 0 var(--lav)}
.tok.right{color:var(--ramz);box-shadow:inset 0 -2px 0 var(--ramz)}
.tok.miss{color:var(--ramz);box-shadow:inset 0 -2px 0 var(--wrong);background:var(--rose-soft)}
.tok.extra{text-decoration:line-through;text-decoration-color:var(--wrong)}
.hint{font-size:13px;color:var(--muted);margin:0 0 16px;text-align:center}
.field{margin-top:14px}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 4px;font-size:14px;cursor:pointer;line-height:1.3}
.chip.reader{font-weight:600}
.chip.on{background:var(--lav);border-color:var(--lav);color:#fff}
.chip.ok{border-color:var(--mint)}
.chip.no{border-color:var(--wrong)}
.mark{font-size:14px;margin-inline-start:6px}

/* خريطة الحل */
.map{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.map h3{margin:0 0 4px;text-align:center;font-size:16px}
.map .root{background:var(--lav);color:#fff;border-radius:999px;padding:8px 14px;text-align:center;font-weight:600;margin:0 auto 12px;max-width:90%}
.branches{display:grid;gap:10px}
.br{border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:15px}
.br b{display:block;color:var(--rose)}
.br.sh{font-family:var(--verse);font-size:18px;line-height:1.9}
.br.sh b{font-family:var(--ui);font-size:15px;color:var(--lav)}
.br.rest b{color:var(--mint)}
.self{display:flex;gap:6px;margin-top:10px}
.self button{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;background:var(--paper);cursor:pointer;font-size:15px}
.self button.on{background:var(--ink);color:var(--paper)}

/* بطاقات */
.flash{perspective:1000px;margin:10px 0}
.fc{min-height:230px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;user-select:none}
.fc .front{font-size:22px;font-weight:600}
.fc .front.sym{font-family:var(--verse);font-size:64px;color:var(--ramz)}
.fc .front.v{font-family:var(--verse);font-size:23px;font-weight:400}
.fc .bk{font-size:18px;color:var(--ink)}
.fc .bk.v{font-family:var(--verse);font-size:23px}
.fc .lbl{font-size:13px;color:var(--muted);margin-top:10px}

/* المرجع */
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:right}
th{background:var(--lav-soft);font-weight:600}
td.s{font-family:var(--verse);font-size:21px;color:var(--ramz);width:56px;text-align:center}
.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--line);margin-bottom:18px}

/* النتيجة */
.score{text-align:center;padding:10px 0 4px}
.score .num{font-family:var(--hand);font-size:64px;color:var(--rose);line-height:1.1}
.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;font-size:15px}
.rev.no{border-color:var(--wrong)}
.rev .a{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* إهداء */
.ded{text-align:center;margin:46px 0 10px;color:var(--muted)}
.ded .to{font-family:var(--hand);font-size:26px;color:var(--rose);display:block;line-height:1.4}
.ded small{font-size:13px;display:block}
.ded .shatora{font-family:var(--hand);font-size:24px;color:var(--lav);display:block;margin-top:2px}
.timer{font-variant-numeric:tabular-nums}

/* المتصدرات */
.lb{display:grid;gap:8px;margin-top:10px}
.lbr{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.lbr.me{border-color:var(--rose);background:var(--rose-soft)}
.lbr .rk{font-size:20px;text-align:center;color:var(--muted)}
.lbr .nm{font-weight:600;overflow-wrap:anywhere}
.lbr small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.lbr .sc{font-weight:700;color:var(--rose);font-size:22px;text-align:left}
.mine{background:var(--lav-soft);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:15px}
.lnk{background:none;border:0;color:var(--lav);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px 0}

:root[data-theme="dark"]{--paper:#2A170F; --card:#3A2218; --ink:#F7E6C8; --muted:#D2B28C; --line:#5B3A28; --rose:#F08A3C; --rose-soft:#4A2A1A; --mint:#8FBF74; --mint-soft:#2B3A22; --lav:#E9A23B; --lav-soft:#4A3418; --ramz:#F3B36B; --wrong:#E0816E; --glow:rgba(240,138,60,.42); --stripe:rgba(255,214,160,.05);}
.theme{background:none;border:1px solid var(--line);border-radius:999px;width:40px;height:40px;cursor:pointer;font-size:18px;line-height:1;padding:0}
.homebar{display:flex;justify-content:flex-end;margin-bottom:-6px}
.hbtns{display:flex;gap:8px;align-items:center}
.count{display:inline-block;background:var(--rose-soft);color:var(--rose);border-radius:999px;padding:4px 14px;font-size:15px;font-weight:600;margin-top:10px}

.lbcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px 8px;margin:16px 0 0}
.lbhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lbhead b{font-size:17px}
.lb.mini{gap:6px;margin-top:4px}
.mini .lbr{padding:7px 12px;border-radius:12px;background:var(--paper)}
.mini .lbr.me{background:var(--rose-soft)}
.mini .sc{font-size:18px}
.gap{text-align:center;color:var(--muted);line-height:1}
.backdrop{position:fixed;inset:0;background:rgba(20,10,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:84vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-bottom:0}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-head b{font-size:20px}

/* مربعات الصفحة الرئيسية */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.tile{--accent:var(--rose);position:relative;aspect-ratio:1/1;border:1px solid transparent;border-radius:28px;padding:16px;text-align:right;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;color:var(--ink);font-family:inherit;touch-action:manipulation;
  box-shadow:0 12px 24px -14px rgba(120,60,90,.55),0 2px 0 rgba(255,255,255,.35) inset;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease,filter .2s ease;animation:rise .55s cubic-bezier(.22,1,.36,1) both}
.tile::after{content:'';position:absolute;inset-inline-start:-34px;bottom:-34px;width:120px;height:120px;border-radius:50%;background:color-mix(in srgb,var(--card) 30%,transparent);pointer-events:none}
.tile>span{position:relative;z-index:1}
.tile .ic{align-self:flex-start;width:48px;height:48px;border-radius:17px;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 62%,transparent);color:var(--accent)}
.tile .ic svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:18px;line-height:1.35;font-weight:600}
.tile small{display:block;font-size:13px;opacity:.82;margin-top:2px;line-height:1.4}
.tile:active{transform:scale(.94);box-shadow:0 6px 14px -10px rgba(120,60,90,.6);filter:brightness(.98)}
@media (hover:hover){.tile:not([disabled]):hover{transform:translateY(-4px);box-shadow:0 18px 30px -14px rgba(120,60,90,.6)}}
.tile[disabled]{opacity:.6;cursor:default;box-shadow:none}
.t-main{background:linear-gradient(145deg,var(--rose),color-mix(in srgb,var(--rose) 62%,#fff));color:var(--card);--accent:var(--rose)}
.t-units{background:linear-gradient(145deg,var(--lav),color-mix(in srgb,var(--lav) 60%,#fff));color:var(--card);--accent:var(--lav)}
.t-exam{background:linear-gradient(145deg,color-mix(in srgb,var(--mint) 40%,var(--card)),color-mix(in srgb,var(--mint) 14%,var(--card)));--accent:var(--mint);border-color:color-mix(in srgb,var(--mint) 22%,transparent)}
.t-shahid{background:linear-gradient(145deg,color-mix(in srgb,var(--rose) 26%,var(--card)),color-mix(in srgb,var(--rose) 9%,var(--card)));--accent:var(--rose);border-color:color-mix(in srgb,var(--rose) 20%,transparent)}
.t-mist{background:linear-gradient(145deg,color-mix(in srgb,var(--wrong) 22%,var(--card)),color-mix(in srgb,var(--wrong) 8%,var(--card)));--accent:var(--wrong);border-color:color-mix(in srgb,var(--wrong) 18%,transparent)}
.t-ref{background:var(--card);border-color:var(--line);--accent:var(--lav)}
.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}.tile:nth-child(5){animation-delay:.2s}.tile:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

.lbr.adm{grid-template-columns:38px 1fr auto auto}
.xdel{border:0;background:var(--rose-soft);color:var(--wrong);width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;touch-action:manipulation}
.xdel:active{transform:scale(.9)}

/* ====== الحركة والانتقالات ====== */
@keyframes riseSoft{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes ringIn{from{stroke-dashoffset:113.1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(70%);opacity:.5}}
@keyframes sheetDown{to{transform:translateY(80%);opacity:.4}}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(112vh) rotate(380deg)}}
#app>*:not(.tiles):not(.top):not(.lb):not(.sx){animation:riseSoft .5s cubic-bezier(.22,1,.36,1) both}
#app>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3){animation-delay:.08s}#app>*:nth-child(4){animation-delay:.12s}
#app>*:nth-child(5){animation-delay:.16s}#app>*:nth-child(6){animation-delay:.2s}#app>*:nth-child(7){animation-delay:.24s}#app>*:nth-child(n+8){animation-delay:.28s}
.hero h1 span{display:inline-block;animation:popIn .8s cubic-bezier(.34,1.56,.64,1) .2s both}
.count{animation:popIn .7s cubic-bezier(.34,1.56,.64,1) .35s both}
.bayt .h{display:block;animation:riseSoft .7s cubic-bezier(.22,1,.36,1) .25s both}.bayt .h:nth-child(2){animation-delay:.4s}
.lbr{animation:slideIn .5s cubic-bezier(.22,1,.36,1) both}
.lbr:nth-child(2){animation-delay:.05s}.lbr:nth-child(3){animation-delay:.1s}.lbr:nth-child(4){animation-delay:.15s}.lbr:nth-child(5){animation-delay:.2s}.lbr:nth-child(n+6){animation-delay:.25s}
.bar i{transform-origin:right;animation:grow 1s cubic-bezier(.22,1,.36,1) .25s both}
.opts .opt{animation:riseSoft .4s cubic-bezier(.22,1,.36,1) both}
.opts .opt:nth-child(2){animation-delay:.04s}.opts .opt:nth-child(3){animation-delay:.08s}.opts .opt:nth-child(4){animation-delay:.12s}
.opt,.mode,.chip,.go,.ghost,.seg button{transition:transform .22s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s,box-shadow .2s}
.opt:not([disabled]):active,.mode:active,.chip:active,.go:active,.ghost:active,.seg button:active{transform:scale(.96)}
.opt.ok{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
.opt.no{animation:shake .45s ease both}
.fb{animation:riseSoft .4s cubic-bezier(.22,1,.36,1) both}
.score .num{animation:popIn .8s cubic-bezier(.34,1.56,.64,1) both}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.petals span{position:absolute;top:-40px;animation:fall linear both}
@supports (view-transition-name:none){
  ::view-transition-old(root){animation:fadeout .16s ease both}
  ::view-transition-new(root){animation:riseSoft .3s cubic-bezier(.22,1,.36,1) both}
}

/* ====== الوحدات: القائمة المنبثقة ====== */
.backdrop{animation:fade .25s ease both}
.backdrop.out{animation:fadeout .22s ease both}
.sheet{max-height:92vh;animation:sheetUp .5s cubic-bezier(.22,1,.36,1) both}
.backdrop.out .sheet{animation:sheetDown .22s ease both}
.sh-grab{width:46px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sh-head{align-items:flex-start}
.sh-head b{display:block;font-size:22px;line-height:1.2}
.sh-head small{color:var(--muted);font-size:13.5px}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ucard{--ua:var(--rose);text-align:right;display:flex;flex-direction:column;gap:6px;min-height:158px;padding:14px;border-radius:24px;cursor:pointer;font-family:inherit;color:var(--ink);touch-action:manipulation;
  border:1px solid color-mix(in srgb,var(--ua) 24%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--ua) 22%,var(--card)),color-mix(in srgb,var(--ua) 6%,var(--card)));
  box-shadow:0 12px 22px -16px color-mix(in srgb,var(--ua) 70%,transparent);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1);animation:riseSoft .55s cubic-bezier(.22,1,.36,1) both}
.ucard:active{transform:scale(.95)}
.uc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:auto}
.un{width:40px;height:40px;border-radius:15px;background:var(--ua);color:var(--card);display:grid;place-items:center;font-weight:700;font-size:19px}
.ut{font-weight:700;font-size:16px;line-height:1.35}
.up{font-size:12.5px;color:var(--muted);line-height:1.5}
.ring{position:relative;width:46px;height:46px;display:inline-grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .tr{stroke:var(--rt,color-mix(in srgb,var(--ua,var(--rose)) 20%,transparent))}
.ring .pg{stroke:var(--rs,var(--ua,var(--rose)));animation:ringIn 1.1s cubic-bezier(.22,1,.36,1) .3s both}
.ring b{font-size:11.5px;color:var(--rs,var(--ua,var(--rose)));font-weight:700}

/* ====== الوحدات: صفحة الوحدة ====== */
.uhero{--ua:var(--rose);position:relative;overflow:hidden;color:var(--card);border-radius:30px;padding:20px 20px 22px;margin:8px 0 0;
  background:linear-gradient(145deg,var(--ua),color-mix(in srgb,var(--ua) 58%,#fff));
  box-shadow:0 18px 30px -18px color-mix(in srgb,var(--ua) 80%,transparent)}
.uhero::after{content:attr(data-n);position:absolute;inset-inline-end:14px;bottom:-34px;font-size:150px;font-weight:800;line-height:1;opacity:.14;pointer-events:none}
.uh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;position:relative;z-index:1}
.uh-n{width:46px;height:46px;border-radius:17px;background:color-mix(in srgb,var(--card) 30%,transparent);display:grid;place-items:center;font-weight:700;font-size:22px}
.uhero h1{margin:0;font-size:27px;line-height:1.3;position:relative;z-index:1}
.uhero p{margin:6px 0 0;opacity:.9;position:relative;z-index:1}
.tile.u{background:linear-gradient(145deg,color-mix(in srgb,var(--ua) 26%,var(--card)),color-mix(in srgb,var(--ua) 8%,var(--card)));--accent:var(--ua);border-color:color-mix(in srgb,var(--ua) 22%,transparent)}
.tile.u.solid{background:linear-gradient(145deg,var(--ua),color-mix(in srgb,var(--ua) 60%,#fff));color:var(--card);border-color:transparent}
.tile.wide{grid-column:1/-1;aspect-ratio:auto;min-height:108px;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px}
.tile.wide .ic{align-self:center}

/* ============ تصميم الجلسات (تدريب / اختبار) ============ */
:root{--disp:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}
.go{border-radius:20px;padding:16px;font-family:var(--disp);font-weight:600;font-size:17px;box-shadow:0 16px 26px -16px color-mix(in srgb,var(--ink) 75%,transparent)}
.go.big{width:100%;font-size:18px;padding:18px}
.go:disabled{opacity:.5}

/* --- الإعداد --- */
.st-hero{padding:6px 0 0}
.st-kick{display:inline-block;font-family:var(--disp);font-size:13.5px;color:var(--ua);background:color-mix(in srgb,var(--ua) 14%,transparent);padding:5px 14px;border-radius:999px;font-weight:500}
.st-hero h1{font-family:var(--disp);font-size:40px;line-height:1.2;margin:14px 0 2px;font-weight:700;letter-spacing:-.6px}
.st-h{font-family:var(--disp);font-size:14.5px;color:var(--muted);font-weight:500;margin:28px 2px 12px}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lv{position:relative;text-align:right;padding:16px;border-radius:24px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:140px;font-family:inherit;color:var(--ink);touch-action:manipulation;transition:transform .28s cubic-bezier(.34,1.56,.64,1),border-color .2s,background .35s,box-shadow .3s}
.lv .dots{display:flex;gap:5px;margin-bottom:10px}
.lv .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .3s}
.lv .dots i.on{background:var(--ua)}
.lv b{font-family:var(--disp);font-size:19px;font-weight:600}
.lv small{color:var(--muted);font-size:13px}
.lv em{font-style:normal;font-size:12px;color:var(--muted);margin-top:auto;line-height:1.55}
.lv .tick{position:absolute;top:12px;inset-inline-end:12px;width:24px;height:24px;border-radius:50%;background:var(--ua);color:var(--card);display:grid;place-items:center;font-size:13px;transform:scale(0);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.lv.on{border-color:var(--ua);background:linear-gradient(150deg,color-mix(in srgb,var(--ua) 22%,var(--card)),color-mix(in srgb,var(--ua) 6%,var(--card)));transform:translateY(-3px);box-shadow:0 16px 26px -18px color-mix(in srgb,var(--ua) 80%,transparent)}
.lv.on .tick{transform:scale(1)}
.lv[disabled]{opacity:.38;pointer-events:none}
.lv:active{transform:scale(.96)}
.cnts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cnts.c3{grid-template-columns:repeat(3,1fr)}
.ct{padding:14px 4px 12px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-family:inherit;color:var(--ink);touch-action:manipulation;transition:transform .28s cubic-bezier(.34,1.56,.64,1),background .3s,border-color .2s}
.ct b{display:block;font-family:var(--disp);font-size:28px;line-height:1.1;font-weight:600}
.ct small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.ct.on{border-color:var(--ua);background:var(--ua);color:var(--card);transform:translateY(-3px)}
.ct.on small{color:var(--card);opacity:.85}
.ct:active{transform:scale(.94)}
.tm{width:100%;margin-top:14px;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-family:inherit;color:var(--ink);text-align:right;touch-action:manipulation}
.tm b{display:block;font-family:var(--disp);font-weight:600}
.tm small{color:var(--muted)}
.sw{width:54px;height:32px;border-radius:32px;background:var(--line);position:relative;flex:none;transition:background .3s}
.sw::after{content:'';position:absolute;top:4px;inset-inline-start:4px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.22);transition:inset-inline-start .35s cubic-bezier(.34,1.56,.64,1)}
.tm.on .sw{background:var(--ua)}
.tm.on .sw::after{inset-inline-start:26px}
.st-note{color:var(--muted);font-size:14px;margin:16px 2px 0}
.st-cta{position:sticky;bottom:0;margin-top:18px;padding:18px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 60%,transparent);z-index:5}
.st-cta .go{background:linear-gradient(145deg,var(--ua),color-mix(in srgb,var(--ua) 62%,#fff));color:var(--card);box-shadow:0 18px 28px -16px color-mix(in srgb,var(--ua) 85%,transparent)}

/* --- شاشة السؤال --- */
.sx{position:relative;isolation:isolate;min-height:calc(100vh - 56px)}
.sx.has-dock{padding-bottom:340px}
.sx.has-dock .flag{display:none}
.sx-orb{position:fixed;z-index:-1;border-radius:50%;filter:blur(64px);pointer-events:none;animation:fade 1s ease both,drift 16s ease-in-out 1s infinite alternate}
.sx-orb.o1{width:300px;height:300px;top:-90px;inset-inline-end:-70px;background:color-mix(in srgb,var(--ua) 40%,transparent)}
.sx-orb.o2{width:260px;height:260px;bottom:40px;inset-inline-start:-90px;background:color-mix(in srgb,var(--lav) 36%,transparent)}
@keyframes drift{to{transform:translate(26px,-34px) scale(1.12)}}
.sx>*:not(.sx-orb):not(.sx-dock){animation:riseSoft .5s cubic-bezier(.22,1,.36,1) both}
.sx>.sx-kick{animation-delay:.05s}.sx>.qcard{animation-delay:.1s}.sx>.flag{animation-delay:.2s}
.sx-top{display:flex;align-items:center;gap:12px;padding:2px 0 16px}
.sx-x{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.sx-x svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none}
.sx-seg{flex:1;display:flex;gap:4px}
.sg{flex:1;min-width:0;height:7px;border-radius:7px;background:color-mix(in srgb,var(--ink) 13%,transparent);transition:background .4s}
.sg.cur{background:var(--ua);animation:pulse 1.6s ease-in-out infinite}
.sg.done{background:color-mix(in srgb,var(--ink) 70%,transparent)}
.sg.ok{background:var(--mint);animation:none}
.sg.no{background:var(--wrong);animation:none}
@keyframes pulse{50%{opacity:.45}}
.sx-chips{display:flex;gap:6px;flex:none}
.sx-chip{font-family:var(--disp);font-weight:600;font-size:14px;padding:7px 12px;border-radius:999px;background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sx-chip[hidden]{display:none}
.sx-chip.hot{background:color-mix(in srgb,var(--rose) 18%,var(--card));color:var(--rose);animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both}
.sx-kick{display:flex;align-items:baseline;gap:8px;margin:2px 0 16px;font-family:var(--disp);color:var(--muted)}
.sx-kick b{font-size:46px;line-height:1;color:var(--ua);font-weight:600;letter-spacing:-1px}
.sx-kick span{font-size:15px}
.sx-kick em{font-style:normal;font-size:13px;margin-inline-start:auto;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--ua) 14%,transparent);color:var(--ua);max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:center;font-weight:500}
.sx .qcard{background:none;border:0;border-radius:0;padding:4px 0 0}
.sx .prompt{font-family:var(--disp);font-size:26px;line-height:1.6;font-weight:600;margin:0 0 24px;letter-spacing:-.2px}
.sx .prompt.long{font-size:21px;line-height:1.7}
.sx .symbig{font-family:var(--verse);font-size:104px;line-height:1.1;width:min(62%,230px);aspect-ratio:1;margin:0 auto 22px;display:grid;place-items:center;border-radius:40px;color:var(--ramz);
  background:linear-gradient(145deg,color-mix(in srgb,var(--ua) 24%,var(--card)),color-mix(in srgb,var(--ua) 6%,var(--card)));
  border:1px solid color-mix(in srgb,var(--ua) 24%,transparent);box-shadow:0 24px 36px -24px color-mix(in srgb,var(--ua) 80%,transparent);animation:popIn .7s cubic-bezier(.34,1.56,.64,1) .15s both}
.sx .symbig[data-l="3"]{font-size:72px}.sx .symbig[data-l="4"]{font-size:60px}.sx .symbig[data-l="5"]{font-size:50px}.sx .symbig[data-l="6"]{font-size:44px}
.sx .qverse{font-family:var(--verse);font-size:24px;line-height:2;border-radius:22px;background:color-mix(in srgb,var(--lav) 14%,var(--card));padding:16px;margin:0 0 20px}
.sx-hint{color:var(--muted);font-size:14px;margin:-8px 0 14px}
.sx .opts{gap:12px;counter-reset:none}
.sx .opt{display:flex;align-items:center;gap:14px;text-align:right;padding:15px 16px;border-radius:22px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--card) 92%,transparent);font-size:17px;font-weight:500;line-height:1.55;color:var(--ink);cursor:pointer;touch-action:manipulation}
.sx .opt::before{content:attr(data-l);flex:none;width:36px;height:36px;border-radius:13px;display:grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:16px;color:var(--muted);background:color-mix(in srgb,var(--ink) 7%,transparent);transition:background .3s,color .3s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.sx .opt:not([disabled]):hover{border-color:color-mix(in srgb,var(--ua) 55%,var(--line))}
.sx .opt.sel{border-color:var(--ua);background:color-mix(in srgb,var(--ua) 12%,var(--card))}
.sx .opt.sel::before{content:'✓';background:var(--ua);color:var(--card)}
.sx .opt.ok{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 18%,var(--card))}
.sx .opt.ok::before{content:'✓';background:var(--mint);color:var(--card);transform:scale(1.08)}
.sx .opt.no{border-color:var(--wrong);background:color-mix(in srgb,var(--wrong) 12%,var(--card))}
.sx .opt.no::before{content:'✕';background:var(--wrong);color:var(--card)}
.sx .opts.done .opt:not(.ok):not(.no){opacity:.5}
.sx .opt.verse{font-family:var(--verse);font-size:21px}
.sx .opts.tf{grid-template-columns:1fr 1fr}
.sx .tf .opt{flex-direction:column;justify-content:center;min-height:132px;font-family:var(--disp);font-size:22px;font-weight:600;gap:10px}
.sx .tf .opt::before{width:46px;height:46px;border-radius:16px;font-size:22px}
.sx input[type=text]{font-size:21px;padding:18px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);font-family:var(--disp)}
.sx input[type=text]:focus{outline:0;border-color:var(--ua);box-shadow:0 0 0 4px color-mix(in srgb,var(--ua) 18%,transparent)}
.sx .qcard .row{margin-top:16px}
.sx .qcard .row .go{width:100%;background:linear-gradient(145deg,var(--ua),color-mix(in srgb,var(--ua) 62%,#fff));color:var(--card);box-shadow:0 18px 28px -16px color-mix(in srgb,var(--ua) 85%,transparent)}
.sx .flag{align-self:flex-start;margin-top:22px}

/* --- شريط التصحيح السفلي --- */
.sx-dock{position:fixed;inset-inline:0;bottom:0;z-index:40;pointer-events:none;display:flex;justify-content:center}
.dock{pointer-events:auto;width:100%;max-width:640px;border-radius:30px 30px 0 0;padding:20px 22px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -22px 44px -24px rgba(60,20,50,.45);animation:dockUp .55s cubic-bezier(.22,1,.36,1) both}
@keyframes dockUp{from{transform:translateY(100%)}}
.dock.ok{background:color-mix(in srgb,var(--mint) 24%,var(--card));border-top:1.5px solid color-mix(in srgb,var(--mint) 45%,transparent)}
.dock.no{background:color-mix(in srgb,var(--wrong) 15%,var(--card));border-top:1.5px solid color-mix(in srgb,var(--wrong) 40%,transparent)}
.dk-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.dk-head b{font-family:var(--disp);font-size:23px;font-weight:700}
.dk-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--card);background:var(--mint);animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both}
.dock.no .dk-ic{background:var(--wrong)}
.dk-pts{margin-inline-start:auto;font-family:var(--disp);font-weight:700;color:var(--mint);background:color-mix(in srgb,var(--mint) 18%,transparent);padding:3px 12px;border-radius:999px;animation:popIn .6s cubic-bezier(.34,1.56,.64,1) .1s both}
.dk-ans{margin:2px 0 6px;font-size:16px}
.dk-ex{margin:4px 0 10px;line-height:1.75;font-size:16px}
.dk-ref{display:inline-block;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--card) 70%,transparent);padding:3px 12px;border-radius:999px}
.dk-ovr{display:block;background:none;border:0;color:var(--lav);text-decoration:underline;font-size:14px;margin-top:10px;cursor:pointer;padding:4px 0}
.dk-next{margin-top:16px;width:100%;color:var(--card)}
.dock.ok .dk-next{background:var(--mint);box-shadow:0 16px 26px -16px color-mix(in srgb,var(--mint) 90%,transparent)}
.dock.no .dk-next{background:var(--wrong);box-shadow:0 16px 26px -16px color-mix(in srgb,var(--wrong) 90%,transparent)}
.toast{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;font-family:var(--disp);font-weight:600;box-shadow:0 16px 30px -12px rgba(0,0,0,.5);animation:toastIn .55s cubic-bezier(.34,1.56,.64,1) both;white-space:nowrap}
.toast.out{animation:toastOut .4s ease both}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-22px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-14px)}}

/* --- النتيجة --- */
.rs{text-align:center}
.rs-hero{padding:12px 0 2px}
.ring.xl{width:176px;height:176px;margin:4px auto 16px;display:grid}
.ring.xl circle{stroke-width:4}
.ring.xl b{font-family:var(--disp);font-size:42px;font-weight:600}
.rs h1{font-family:var(--disp);font-size:30px;margin:0;font-weight:700}
.rs-hero p{color:var(--muted);margin:6px 0 0}
.rs-dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:20px 8px}
.rs-dots i{width:12px;height:12px;border-radius:50%;background:var(--line);animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both}
.rs-dots i.ok{background:var(--mint)}.rs-dots i.no{background:var(--wrong)}
.rs-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 18px}
.rs-stats div{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 6px}
.rs-stats b{display:block;font-family:var(--disp);font-size:28px;font-weight:600;color:var(--ua)}
.rs-stats small{color:var(--muted)}
.rs .row{justify-content:center}
.rs .row .go{flex:1}
.rev{border-radius:20px}

.sx textarea{border-radius:20px;padding:14px 16px;font-size:17px;border:1.5px solid var(--line);background:var(--card);font-family:inherit;color:var(--ink)}
.sx textarea:focus{outline:0;border-color:var(--ua);box-shadow:0 0 0 4px color-mix(in srgb,var(--ua) 18%,transparent)}
.sx .chip{border-radius:14px;padding:10px 4px}
.sx .field label{font-family:var(--disp);font-weight:500}
.rs .go{background:linear-gradient(145deg,var(--ua),color-mix(in srgb,var(--ua) 62%,#fff));color:var(--card);box-shadow:0 18px 28px -16px color-mix(in srgb,var(--ua) 85%,transparent)}

.half.off{opacity:.34;filter:grayscale(.7);pointer-events:none;user-select:none}
.ask-note{display:inline-block;font-family:var(--disp);font-size:13.5px;font-weight:600;color:var(--ua,var(--rose));background:color-mix(in srgb,var(--ua,var(--rose)) 14%,transparent);padding:6px 14px;border-radius:999px;margin:0 0 12px}

/* ===== غرفة الشماعة ===== */
body{background-color:var(--paper);background-image:radial-gradient(120% 55% at 18% 8%,var(--glow),transparent 62%),repeating-linear-gradient(90deg,var(--stripe) 0 2px,transparent 2px 38px),radial-gradient(circle at 19px 19px,var(--stripe) 2px,transparent 3px);background-size:auto,auto,38px 56px;background-attachment:fixed;min-height:100vh}
.brand{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--rose)}
.hero{position:relative;padding:14px 4px 0;min-height:300px}
.hero h1{font-family:var(--disp);font-weight:700;font-size:50px;line-height:1.1;width:62%;position:relative;z-index:2}
.hero h1 span{color:var(--rose);display:inline-block}
.hero h1 em{font-style:normal;font-size:40px;color:var(--ramz)}
.rack{position:absolute;left:-4px;top:6px;width:150px;height:315px;z-index:1;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}
.pill,.count{display:inline-block;padding:5px 14px;border-radius:999px;border:1.5px solid var(--lav);color:var(--lav);background:color-mix(in srgb,var(--lav) 12%,transparent);font-size:14px;font-weight:600;margin-top:10px}
.hero p{position:relative;z-index:2}
.rail{height:12px;border-radius:6px;margin-top:22px;background:linear-gradient(180deg,#e48a3d,#8a4a1f);box-shadow:0 8px 14px -6px rgba(0,0,0,.55)}
.tiles{margin:12px 0 0;padding:0 6px;gap:14px}
.tile{aspect-ratio:auto;min-height:150px;border-radius:6px 6px 34px 34px/6px 6px 16px 16px;padding:28px 14px 16px;box-shadow:0 18px 26px -14px rgba(0,0,0,.55)}
.tile::before{content:'';position:absolute;top:-6px;right:50%;margin-right:-7px;width:14px;height:14px;border-radius:50%;border:3px solid #e9a23b;background:var(--paper);z-index:2}
.t-main{background:linear-gradient(160deg,#f29a4c,#c9602a);color:#fff4de}
.t-exam{background:linear-gradient(160deg,#fbefd6,#ecca92);color:#3b2216;border-color:transparent;--accent:#b96125}
.t-mist{background:color-mix(in srgb,var(--card) 70%,transparent);border:1.5px solid color-mix(in srgb,var(--lav) 60%,transparent);color:var(--ink);--accent:var(--rose)}
.tile.wide{min-height:84px;padding:14px 16px;border-radius:22px;margin-top:2px}
.tile.wide::before{display:none}
.lbcard{border:1.5px solid var(--lav);background:color-mix(in srgb,var(--card) 82%,transparent);border-radius:22px;margin-top:22px}
.lbcard b{font-family:var(--disp)}
/* السؤال: إطار ذهبي مقوّس */
.sx .prompt{position:relative;text-align:center;color:#3b2216;font-size:22px;line-height:1.65;padding:44px 24px 26px;margin:0 0 22px;border:7px solid transparent;border-radius:150px 150px 28px 28px/120px 120px 28px 28px;background:linear-gradient(180deg,#fbefd6,#f0d6a6) padding-box,linear-gradient(160deg,#f6c25d,#c9802a 55%,#8a4a1f) border-box;box-shadow:0 24px 40px -20px rgba(0,0,0,.6)}
.sx .prompt.long{font-size:19px;padding-top:46px}
.sx .opts{position:relative;padding-top:16px;background:linear-gradient(180deg,#e48a3d,#8a4a1f) top/100% 10px no-repeat;border-radius:5px}
.sx .opt{border-radius:8px 8px 22px 22px/8px 8px 12px 12px;border-color:color-mix(in srgb,var(--lav) 35%,var(--line));background:color-mix(in srgb,var(--card) 88%,transparent)}
.sx .opt::before{border-radius:50%}
.sx-kick b{font-family:var(--disp)}
.dock{background:linear-gradient(180deg,#fbefd6,#f0d6a6);color:#3b2216}
.dock.ok,.dock.no{background:linear-gradient(180deg,#fbefd6,#f0d6a6)}
.dock .dk-ex,.dock .dk-ans{color:#3b2216}
.dock.ok .dk-head b{color:#3d6a2a}.dock.no .dk-head b{color:#a8382a}
.dk-ref{background:rgba(59,34,22,.1);color:#5a3a26}
/* النتيجة: مرآة */
.ring.xl{width:190px;height:236px;margin:6px auto 18px;border-radius:50%;border:9px solid transparent;background:radial-gradient(100% 80% at 35% 25%,#fff7e6,#f0d6a6) padding-box,linear-gradient(160deg,#f6c25d,#c9802a 55%,#8a4a1f) border-box;box-shadow:0 24px 40px -14px rgba(0,0,0,.6)}
.ring.xl .tr{stroke:rgba(185,97,37,.2)}
.ring.xl .pg{stroke:#f08a3c}
.ring.xl b{color:#3b2216}
.rs-stats div{border-radius:8px 8px 22px 22px/8px 8px 12px 12px;background:linear-gradient(160deg,#fbefd6,#ecca92);border:0;color:#3b2216}
.rs-stats small{color:#6b4a33}
.rs-dots i.ok{background:var(--mint)}

/* ===== حركة الانتقال بين الصفحات ===== */
::view-transition-group(root){animation-duration:.55s}
::view-transition-old(root){animation:vtOutF .34s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:vtInF .6s cubic-bezier(.22,1,.36,1) both}
html[data-dir="back"]::view-transition-old(root){animation-name:vtOutB}
html[data-dir="back"]::view-transition-new(root){animation-name:vtInB}
@keyframes vtInF{from{opacity:0;transform:translateX(-56px) scale(.95);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes vtOutF{to{opacity:0;transform:translateX(44px) scale(.97);filter:blur(5px)}}
@keyframes vtInB{from{opacity:0;transform:translateX(56px) scale(.95);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes vtOutB{to{opacity:0;transform:translateX(-44px) scale(.97);filter:blur(5px)}}
.tile,.sx .opt,.go,.ghost{will-change:transform}
.tile:nth-child(1){animation:tileDrop .7s cubic-bezier(.34,1.4,.64,1) .08s both}
.tile:nth-child(2){animation:tileDrop .7s cubic-bezier(.34,1.4,.64,1) .18s both}
.tile:nth-child(3){animation:tileDrop .7s cubic-bezier(.34,1.4,.64,1) .28s both}
@keyframes tileDrop{from{opacity:0;transform:translateY(-26px) rotate(-2deg);transform-origin:50% 0}60%{transform:translateY(5px) rotate(.8deg)}to{opacity:1;transform:none}}
.sx .prompt{animation:archIn .7s cubic-bezier(.22,1,.36,1) both}
.sx .opts .opt{animation:clothIn .55s cubic-bezier(.22,1,.36,1) both;transform-origin:50% 0}
.sx .opts .opt:nth-child(1){animation-delay:.12s}.sx .opts .opt:nth-child(2){animation-delay:.2s}.sx .opts .opt:nth-child(3){animation-delay:.28s}.sx .opts .opt:nth-child(4){animation-delay:.36s}
@keyframes archIn{from{opacity:0;transform:translateY(-18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes clothIn{from{opacity:0;transform:translateY(-12px) scaleY(.88)}to{opacity:1;transform:none}}
.ring.xl{animation:mirrorIn .9s cubic-bezier(.34,1.3,.64,1) both}
@keyframes mirrorIn{from{opacity:0;transform:scale(.7) rotate(-6deg)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===== حرز — البيانات وبنك الأسئلة ===== */
/* شمّاعة الخلاف المشروخة — بنك الأسئلة (كله اختيار من متعدد) */
const READERS=[],RAWIS=[],GROUPS=[],SHAHID=[],ALL={};
const UNITS=[{id:'u1',title:'شمّاعة الخلاف المشروخة',pages:'ص ١–٧'}];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim()}
function parseNames(){return new Set()}
function setMatches(){return false}
function buildBank(){
  const B=[];
  const Q=(n,prompt,correct,wrongs,explain,ref)=>B.push({id:'u1-'+n,unit:'u1',type:'mcq',prompt,options:[correct,...wrongs],correct,explain,ref});
  Q(1,'ما موضوع سلسلة «شمّاعة الخلاف المشروخة»؟','حقيقة الخلاف في تغطية المرأة وجهها وكفيها عن الرجل الأجنبي',['حقيقة الخلاف في لباس المرأة المسلمة في صلاتها وخارجها','حكم خروج المرأة المسلمة من بيتها للعمل أو للدراسة','حقيقة الخلاف في كشف المرأة المسلمة شعرها أمام محارمها'],'هذا عنوان السلسلة في الصفحة الأولى.','ص١');
  Q(2,'على ماذا اتفق جمهور العلماء من جميع المذاهب؟','وجوب تغطية المرأة المسلمة وجهها وكفيها عن الرجال الأجانب',['جواز كشف المرأة المسلمة وجهها وكفيها أمام الأجانب مطلقاً','استحباب تغطية المرأة المسلمة وجهها وكفيها دون وجوبها','وجوب تغطية المرأة المسلمة وجهها وكفيها أمام محارمها'],'اتفق الجمهور على وجوب التغطية عن الرجال الأجانب في أحوال معينة.','ص٢');
  Q(3,'أي هذه ليس من الأحوال الثلاثة التي اتفق فيها الجمهور على وجوب التغطية؟','ضعف الإيمان',['فساد الزمان','النظر بشهوة','خشية الفتنة'],'الأحوال الثلاثة: فساد الزمان، والنظر بشهوة، وخشية الفتنة.','ص٢');
  Q(4,'كم عدد الأحوال التي اتفق فيها الجمهور على وجوب التغطية؟','ثلاثة',['اثنان','أربعة','خمسة'],'فساد الزمان، والنظر بشهوة، وخشية الفتنة.','ص٢');
  Q(5,'في أي شيء اختلف الجمهور بعد اتفاقهم على وجوب التغطية؟','العلة (السبب) الموجبة للتغطية',['أصل الحكم بين الوجوب والاستحباب','مقدار الستر المطلوب في الصلاة','من يجب الستر عنه من الرجال'],'اتفقوا على وجوب التغطية لكنهم اختلفوا في العلة.','ص٣');
  Q(6,'إلى كم فريق انقسم العلماء في علة التغطية؟','فريقين',['ثلاثة فرق','أربعة فرق','خمسة فرق'],'الفريق الأول: «لأنها عورة». الفريق الثاني: «خشية الفتنة».','ص٣');
  Q(7,'ما علة التغطية عند الفريق الأول؟','لأنها عورة',['خشية الفتنة','فساد الزمان','النظر بشهوة'],'يرى الفريق الأول أن المرأة عورة فتستر وجهها وكفيها.','ص٣');
  Q(8,'ما علة التغطية عند الفريق الثاني؟','خشية الفتنة',['لأنها عورة','فساد الزمان','النظر بشهوة'],'علة الفريق الثاني هي «خشية الفتنة».','ص٣');
  Q(9,'ما الذي يترتب على القول بأن المرأة «عورة» في الفريق الأول؟','تُستر وتُحجب مطلقاً',['تُستر عند خشية الفتنة فقط','تُستر عند النظر بشهوة فقط','تُستر في الأماكن العامة فقط'],'قال الفريق الأول: «فتُستر وتُحجب مطلقاً».','ص٣');
  Q(10,'أي القائلين التاليين يرى أن علة التغطية «أنها عورة»؟','متأخرو الحنفية',['متقدمو الحنفية','متقدمو الشافعية','ابن بطال من المالكية'],'قال بها متأخرو الحنفية ومتأخرو المالكية على المشهور، وهي الراجح المعتمد عند الشافعية، ومذهب الحنابلة.','ص٣');
  Q(11,'أي القائلين التاليين يرى أن علة التغطية «خشية الفتنة»؟','متقدمو الحنفية',['متأخرو الحنفية','متأخرو المالكية','مذهب الحنابلة'],'قال بها متقدمو الحنفية ومتقدمو الشافعية (مقابل الصحيح المعتمد) وابن بطال من المالكية.','ص٣');
  Q(12,'إلى أي فريق ينتمي مذهب الحنابلة بحسب الملف؟','الفريق الأول (العورة)',['الفريق الثاني (خشية الفتنة)','ينقسم الحنابلة بين الفريقين','لا ينتمي إلى أي من الفريقين'],'الفريق الأول مذهب الحنابلة.','ص٣');
  Q(13,'من القائل من المالكية بعلة «خشية الفتنة»؟','ابن بطال',['متأخرو المالكية','مشهور مذهب المالكية','جمهور علماء المالكية'],'متأخرو المالكية على المشهور عندهم من الفريق الأول، وابن بطال من الفريق الثاني.','ص٣');
  Q(14,'ما مكانة القول بـ«خشية الفتنة» عند الشافعية؟','قال به متقدموهم وهو مقابل الصحيح المعتمد',['هو الراجح المعتمد عند جميع الشافعية','لم يقل به أحد من علماء الشافعية قط','هو مذهب الشافعية قديماً وحديثاً كله'],'الراجح المعتمد عند الشافعية هو علة العورة.','ص٣');
  Q(15,'كم وجهاً ذكره الملف في الرد على سؤال: «إذا أُمنت الفتنة فيجوز الكشف»؟','ثلاثة أوجه',['وجهان','أربعة أوجه','خمسة أوجه'],'أولاً: أدلتهم لا تخرج عن أربع حالات. ثانياً: مخالفة الجِبِلّة. ثالثاً: فرض الحجاب في خير زمان.','ص٤');
  Q(16,'ما الوجه الأول في الرد على القائلين بجواز الكشف إذا أُمنت الفتنة؟','أن أدلتهم لا تخرج عن أربع حالات',['مخالفة الجِبِلّة في الميل للنساء','فرض الحجاب في خير زمان وأفضله','إجماع الصحابة على لزوم التغطية'],'الوجه الأول: «أدلتهم لا تخرج عن أربع حالات».','ص٤');
  Q(17,'كم حالة لا تخرج عنها أدلة من أباحوا كشف الوجه بحسب الملف؟','أربع حالات',['ثلاث حالات','خمس حالات','ست حالات'],'ضعيفة، أو في حق القواعد، أو قبل نزول فرض الحجاب، أو لحالة مخصوصة.','ص٤');
  Q(18,'أي مما يلي من الحالات التي لا تخرج عنها أدلتهم؟','أن تكون في حق القواعد من النساء',['أن تكون في حق الشابات المتزوجات','أن تكون بعد نزول فرض الحجاب','أن تكون في الأحاديث المتفق عليها'],'الحالة الثانية: في حق القواعد من النساء.','ص٤');
  Q(19,'أي هذه ليست من الحالات الأربع لأدلتهم؟','أن تكون في حق المحارم',['أن تكون ضعيفة','أن تكون قبل نزول فرض الحجاب','أن تكون لحالة مخصوصة'],'الحالات: ضعيفة، القواعد، قبل فرض الحجاب، حالة مخصوصة.','ص٤');
  Q(20,'ما أمثلة «الحالة المخصوصة» التي ذكرها الملف؟','الخطبة والعلاج والشهادة',['الدراسة والعمل والتسوق','السفر والزيارة والضيافة','الصلاة والصيام والاعتكاف'],'مثل: الخطبة والعلاج والشهادة.','ص٤');
  Q(21,'ما الوجه الثاني في الرد على من قال بالجواز عند أمن الفتنة؟','مخالفة الجِبِلّة',['ضعف أحاديث الإباحة','فرض الحجاب في خير زمان','فساد الزمان في عصرنا'],'الوجه الثاني: مخالفة الجِبِلّة.','ص٤');
  Q(22,'ما المقصود بمخالفة الجِبِلّة في الرد؟','أن الله جبل الرجال والنساء على الميل لبعضهم فلا تؤمن الفتنة',['أن الله جبل النساء على الحياء فتؤمن الفتنة بهن دائماً','أن الله جبل الرجال على النفرة من النساء وعدم الميل إليهن','أن الله جبل الرجال على غض البصر فتؤمن الفتنة عندهم'],'«إن الله جبل الرجال والنساء على الميل لبعضهم».','ص٤');
  Q(23,'ما درجة حديث «ما تركت بعدي فتنة أضر على الرجال من النساء» بحسب الملف؟','صحيح متفق عليه',['حسن غريب','ضعيف لا يحتج به','موقوف على الصحابة'],'وصفه الملف بأنه الحديث الصحيح المتفق عليه.','ص٤');
  Q(24,'بحسب الحديث الذي أورده الملف، في ماذا كانت أول فتنة بني إسرائيل؟','في النساء',['في المال','في الملك','في الحكم'],'«فإن أول فتنة بني إسرائيل كانت في النساء».','ص٤');
  Q(25,'ما حاصل الوجه الثالث «فرض الحجاب في خير زمان»؟','أنهن أُمرن بالحجاب في خير القرون فمن بعدهم أولى',['أن الصحابيات كنّ يكشفن وجوههن لأن الفتنة مأمونة','أن الحجاب فُرض لفساد الزمان في عهد النبوة فقط','أن زماننا أصلح من خير القرون فتؤمن فيه الفتنة'],'الأمر بالحجاب نزل في خير القرون فكيف يؤمن الفتنة زمان بعدهم؟','ص٤');
  Q(26,'ما المقصود باشتراط «الأمن من الفتنة» و«النظر بغير شهوة» في كلام الفقهاء؟','أنه في حق ناظر مخصوص يباح له النظر للحاجة والضرورة',['أنه في حق كل رجل في الأسواق والأماكن العامة','أنه في حق الرجال الصالحين دون غيرهم من الناس','أنه في حق النساء الكبيرات دون الشابات منهن'],'مرادهم ناظر مخصوص ممن يباح له النظر للحاجة والضرورة.','ص٥');
  Q(27,'من أمثلة الناظر المخصوص الذي يباح له النظر للحاجة والضرورة:','الطبيب والقاضي',['الجار والصديق','البائع والمشتري','المعلم والزميل'],'مثّل الملف بالطبيب والقاضي وغيرهما.','ص٥');
  Q(28,'لماذا لا تتحقق شروط الأمن من الفتنة إذا أسفرت المرأة أمام الجماهير؟','لأن بين الناس الكافر والفاسق وغيرهما',['لأن عدد الرجال الأجانب بين الناس قليل','لأن الأصل في الجماهير الاستقامة والصلاح','لأن الفقهاء لم يشترطوا ذلك أصلاً'],'لعدم إمكان تحقق الشروط، وفي الناس الكافر والفاسق وغيرهما.','ص٥');
  Q(29,'ما الذي تدل عليه نصوص الفقهاء الطافحة من كل المذاهب؟','أن الأصل ستر المرأة لوجهها وهي ملتزمة به',['أن الأصل كشف المرأة لوجهها إلا عند الفتنة','أن الأصل ستر الوجه في الصلاة دون خارجها','أن الأصل كشف الوجه إلا في الأسواق العامة'],'نصوصهم تدل على أن الأصل ستر المرأة لوجهها ملتزمة به.','ص٥');
  Q(30,'ما حكم الشهادة على المنتقبة إذا عرفها الشاهد بالنقاب؟','لا يباح لها كشف وجهها وتصح الشهادة عليها',['يجب عليها كشف وجهها لتصح الشهادة عليها','يباح لها كشف وجهها لكن لا تصح الشهادة','لا تصح الشهادة عليها حتى يرى الشاهد وجهها'],'هو المفتى به عند الحنفية ومذهب المالكية والشافعية والحنابلة.','ص٥');
  Q(31,'من وافق الحنفية في حكم الشهادة على المنتقبة؟','المالكية والشافعية والحنابلة',['المالكية والشافعية دون الحنابلة','الشافعية والحنابلة دون المالكية','المالكية والحنابلة دون الشافعية'],'هو مذهب المالكية والشافعية والحنابلة.','ص٥');
  Q(32,'ماذا يفعل القاضي عند المالكية إذا احتاج إلى كشف وجه امرأة ليعرّف بها؟','يكشفه بين أيدي العدول ويأمر بتنحية غيرهم',['يكشفه أمام جميع الحاضرين في مجلس القضاء','يكشفه وحده دون حضور أحد معه من الناس','يكتفي بشهادة الشهود على صفتها كاملة'],'يكشفه بين أيدي العدول ويأمر بتنحية غيرهم.','ص٥');
  Q(33,'ماذا يفعل كاتب القاضي عند الحنفية إذا أراد ذكر وصف المرأة؟','يترك موضع حليتها ووصفها ليكتبه القاضي',['يكتب وصفها بعد أن ينظر هو إلى وجهها','يطلب منها كشف وجهها ليكتب وصفها بنفسه','يكتب وصفها بحسب ما يخبره الشهود عنها'],'يترك موضع الحلية والوصف حتى يكتبه القاضي لينظر القاضي فقط.','ص٥');

function priority(q){

}

function poolFor(opts){
  let pool=opts.ids?opts.ids.map(id=>BYID[id]).filter(Boolean):opts.scope==='all'?BANK:opts.scope==='mistakes'?mistakes():BANK.filter(q=>q.unit===opts.scope);
  if(opts.only)pool=pool.filter(q=>q.type===opts.only);
  if(opts.level&&opts.level!=='mix')pool=pool.filter(q=>diff(q)===+opts.level);
  return pool;
}
function setupView(kind,scope){

      <h3 class="st-h">عدد الأسئلة</h3>

    </div>`;
    app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{level=b.dataset.l;draw()});

  }
  draw();
}

const X_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function buzz(ok){try{navigator.vibrate&&navigator.vibrate(ok?12:[30,40,30])}catch(e){}}
const mmss=ms=>{ms=Math.max(0,ms);return AR(Math.floor(ms/60000))+':'+AR(String(Math.floor(ms%60000/1000)).padStart(2,'0'))};
function runSession(opts){
  const pool=poolFor(opts);
  if(!pool.length){app.innerHTML=`${hdr('go(home)')}<div class="empty">لا توجد أسئلة هنا الآن. ${opts.scope==='mistakes'?'لا أخطاء محفوظة، أحسنتِ.':''}</div>`;return}
  const n=Math.min(opts.n||15,pool.length);
  let queue=selectQs(pool,n), idx=0, log=[], deadline=opts.timed?Date.now()+n*60000:null;
  const exam=opts.mode==='exam';
  const back=opts.scope==='all'||opts.scope==='mistakes'?'go(home)':`go(unitView,'${opts.scope}')`;
  const streakNow=()=>{let s=0;for(let i=log.length-1;i>=0;i--){if(log[i].ok===true)s++;else break}return s};
  if(deadline){timerId=setInterval(()=>{const el=$('#timer');const left=deadline-Date.now();if(left<=0){clearInterval(timerId);finish();return}if(el)el.textContent=mmss(left)},1000)}

  function next(){idx++; if(idx>=queue.length)finish(); else draw()}
  function draw(){
    const q=queue[idx];
    const ui=Math.max(0,UNITS.findIndex(u=>u.id===q.unit));
    const col=exam?'--lav':UCOL[ui%3];
    const segs=queue.map((_,i)=>{const l=log[i];return `<i class="sg ${i<idx?(exam?'done':(l&&l.ok?'ok':'no')):i===idx?'cur':''}"></i>`}).join('');
    const sc=log.filter(l=>l.ok===true).length, st=streakNow();

    };

/* ===== عرض السؤال ===== */
const LET=['أ','ب','ج','د','هـ','و','ز','ح','ط','ي'];
const PRAISE=['أحسنتِ','ممتازة','رائعة','متألقة','صح عليك'], OOPS=['قريبة','لا بأس','حاولي من جديد','ولا يهمك'];
let _pi=0;
function showDock(html){
  const f=$('#fbx');if(!f)return;
  f.innerHTML=html;
  const sx=app.querySelector('.sx');if(sx)sx.classList.add('has-dock');
  const nx=$('#nx');if(nx)nx.focus({preventScroll:true});
  requestAnimationFrame(()=>{
    const dk=f.querySelector('.dock');if(!dk||!sx)return;
    const h=dk.offsetHeight;
    sx.style.paddingBottom=(h+28)+'px';
    const tg=app.querySelector('.opt.ok')||app.querySelector('#ans')||app.querySelector('.opt.no');
    if(tg){
      const r=tg.getBoundingClientRect(), limit=window.innerHeight-h-16;
      if(r.bottom>limit)window.scrollBy({top:r.bottom-limit,behavior:'smooth'});
    }
  });
}
function renderQ(q,el,{exam,onDone,onNext}){
  if(q.type==='shahid')return renderShahid(q,el,{exam,onDone,onNext});
  const fb=(ok,extra,foot)=>exam?'':`<div class="dock ${ok?'ok':'no'}"><div class="dk-head"><span class="dk-ic">${ok?CHK:CRS}</span><b>${ok?PRAISE[_pi++%PRAISE.length]:OOPS[_pi++%OOPS.length]}</b>${ok?'<span class="dk-pts">+١</span>':''}</div>${extra?`<div class="dk-ans">${extra}</div>`:''}<p class="dk-ex">${esc(q.explain||'')}</p><span class="dk-ref">${esc(q.ref||'')}</span>${foot||''}<button class="go dk-next" id="nx">التالي</button></div>`;
  const sym=q.big&&q.prompt.includes('«')?q.prompt.match(/«([^»]+)»/)[1]:'';
  const head=`${sym?`<div class="symbig" data-l="${sym.length}">${esc(sym)}</div>`:''}<p class="prompt ${q.prompt.length>70?'long':''}">${esc(q.prompt)}</p>${q.verse?`<div class="qverse">${esc(q.verse)}</div>`:''}`;
  const tf=q.type==='mcq'&&q.options.length===2&&q.options[0]==='صح';
  if(q.type==='mcq'){
    const opts=q.fixed?q.options:shuffle(q.options);
    el.innerHTML=`${head}<div class="opts ${tf?'tf':''}">${opts.map((o,i)=>`<button class="opt ${q.verseOpts?'verse':''}" data-i="${i}" data-l="${tf?(o==='صح'?'✓':'✕'):LET[i]}">${esc(o)}</button>`).join('')}</div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const pickd=opts[+b.dataset.i], ok=pickd===q.correct;
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(!exam&&opts[+x.dataset.i]===q.correct)x.classList.add('ok')});
      if(!exam&&!ok)b.classList.add('no'); if(exam)b.classList.add('sel');
      el.querySelector('.opts').classList.add('done');
      onDone(ok,pickd);
      if(!exam){showDock(fb(ok));$('#nx').onclick=onNext}
    });
  }else if(q.type==='multi'){
    const opts=shuffle(q.options),sel=new Set();
    el.innerHTML=`${head}<p class="sx-hint">اختاري كل الإجابات الصحيحة ثم اضغطي «تحقّقي»</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-l="${LET[i]}" aria-pressed="false">${esc(o)}</button>`).join('')}</div><div class="row"><button class="go" id="chk">تحقّقي</button></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=opts[+b.dataset.i];sel.has(v)?sel.delete(v):sel.add(v);b.classList.toggle('sel');b.setAttribute('aria-pressed',sel.has(v))});
    $('#chk').onclick=()=>{
      const ok=sameSet(sel,q.correct);
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const v=opts[+x.dataset.i];if(!exam){x.classList.remove('sel');if(q.correct.includes(v))x.classList.add('ok');else if(sel.has(v))x.classList.add('no')}});
      el.querySelector('.opts').classList.add('done');
      $('#chk').remove();onDone(ok,[...sel].join('، '));
      if(!exam){showDock(fb(ok));$('#nx').onclick=onNext}
    };
  }else if(q.type==='text'){
    el.innerHTML=`${head}<input type="text" id="ans" autocomplete="off" placeholder="اكتبي إجابتك هنا"><div class="row"><button class="go" id="chk">تحقّقي</button></div>`;
    const inp=$('#ans');inp.focus({preventScroll:true});
    inp.onkeydown=e=>{if(e.key==='Enter')$('#chk').click()};
    $('#chk').onclick=()=>{
      const v=inp.value.trim(); if(!v){inp.focus();return}
      const ok=checkText(q,v);
      inp.disabled=true; $('#chk').remove();
      if(exam){onDone(ok,v);return}
      inp.classList.add(ok?'ok':'no');
      showDock(fb(ok,ok?'':`الإجابة الصحيحة: <b>${esc(q.model)}</b>`,ok?'':'<button class="dk-ovr" id="ovr">إجابتي صحيحة بصيغة أخرى</button>'));
      let done=false;const fin=r=>{if(done)return;done=true;onDone(r,v)};
      $('#nx').onclick=()=>{fin(ok);onNext()};
      if(!ok)$('#ovr').onclick=()=>{fin(true);onNext()};
    };
  }
}
function checkText(q,v){
  if(q.mode==='exact')return q.accept.some(a=>norm(a)===norm(v));
  if(q.special&&q.special.some(s=>norm(v).includes(norm(s))))return true;
  return setMatches(v,q.ids);
}

/* ===== الشاهد ===== */
function renderShahid(q,el,{exam,onDone,onNext}){
  // تقطيع البيت إلى كلمات قابلة للنقر. الشطر غير المطلوب يظهر باهتاً وغير قابل للّمس
  let k=0;const targets=new Set();
  const isAct=(li,hi)=>!q.ask||q.ask.some(([a,b])=>a===li&&b===hi);
  const lineHtml=(line,li)=>line.map((half,hi)=>{
    if(!isAct(li,hi))return `<span class="half off" aria-hidden="true">${half.replace(/[{}]/g,'')}</span>`;
    return `<span class="half">${
      half.split(/(\{[^}]+\}|\s+)/).filter(s=>s&&!/^\s+$/.test(s)).map(w=>{
        const t=w.startsWith('{');const txt=t?w.slice(1,-1):w;const id=k++;if(t)targets.add(id);
        return `<button class="tok" data-k="${id}">${txt}</button>`}).join(' ')}</span>`}).join('');
  const verses=q.lines.map((l,li)=>`<div class="sh-verse">${lineHtml(l,li)}</div>`).join('');
  const askLbl=q.ask?(q.askLabel||(q.lines.length===1?(q.ask[0][1]===0?'المطلوب: الشطر الأول من البيت فقط':'المطلوب: الشطر الثاني من البيت فقط'):'المطلوب: الأجزاء الواضحة فقط')):'';
  const askNote=askLbl?`<div class="ask-note">${esc(askLbl)}</div>`:'';
  const readerChips=READERS.map(r=>[r.id,...r.rawis]).flat();
  el.innerHTML=`<p class="prompt">استخرجي الخريطة من البيت</p>${askNote}${verses}
  <p class="hint">${q.ask?'المسي الكلمات التي فيها رمز أو اسم القارئ في الشطر المطلوب فقط':'المسي الكلمات التي فيها رمز أو اسم القارئ'}</p>
  <div class="field"><label for="w">اللفظ القرآني المختلف فيه</label><input type="text" id="w" autocomplete="off"></div>
  <div class="field"><label>المرموز لهم أو المصرّح بأسمائهم (لا تختاري الباقين)</label>
    <div class="chips">${readerChips.map(id=>`<button class="chip ${ALL[id].rawis?'reader':''}" data-id="${id}">${label(id)}</button>`).join('')}</div></div>
  <div class="field"><label for="sh">الشاهد</label><textarea id="sh" placeholder="اكتبي موضع الشاهد من البيت"></textarea></div>
  <div class="field"><label for="ra">وجه قراءة المرموز لهم</label><textarea id="ra"></textarea></div>
  <div class="field"><label for="rb">قراءة الباقين</label><textarea id="rb"></textarea></div>
  <div class="row"><button class="go" id="chk">تحقّقي</button></div><div id="res"></div>`;
  const tsel=new Set(), csel=new Set();
  el.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{const id=+b.dataset.k;tsel.has(id)?tsel.delete(id):tsel.add(id);b.classList.toggle('on')});
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const id=b.dataset.id;csel.has(id)?csel.delete(id):csel.add(id);b.classList.toggle('on')});
  $('#chk').onclick=()=>{
    const who=q.groups.flatMap(g=>g.who);
    const wv=$('#w').value, shv=$('#sh').value;
    const part={
      word: q.accept.some(a=>{const A=norm(a),V=norm(wv);return V&&(A===V||V.includes(A)||A.includes(V)&&V.length>=4)}),
      toks: sameSet(tsel,targets),
      who: sameSet(csel,who),
      shahid: (()=>{const A=norm(q.shahid),V=norm(shv);if(!V)return false;if(A===V)return true;const aw=A.split(' '),vw=new Set(V.split(' '));return aw.filter(w=>vw.has(w)).length/aw.length>=.85})(),
      read:null
    };
    // إظهار التصحيح على البيت والأزرار
    el.querySelectorAll('.tok').forEach(b=>{b.disabled=true;const id=+b.dataset.k;b.classList.remove('on');if(targets.has(id))b.classList.add(tsel.has(id)?'right':'miss');else if(tsel.has(id))b.classList.add('extra')});
    el.querySelectorAll('.chip').forEach(b=>{b.disabled=true;const id=b.dataset.id;if(who.includes(id))b.classList.add(csel.has(id)?'on':'ok');else if(csel.has(id)){b.classList.remove('on');b.classList.add('no')}});
    ['w','sh','ra','rb'].forEach(i=>$('#'+i).disabled=true);
    $('#w').classList.add(part.word?'ok':'no');$('#sh').classList.add(part.shahid?'ok':'no');
    $('#chk').remove();
    const tick=v=>v?'<span class="mark">✓</span>':'<span class="mark" style="color:var(--wrong)">✗</span>';
    $('#res').innerHTML=`
    <div class="map"><h3>الخريطة الصحيحة</h3>
      <div class="root">${esc(q.word)} ${tick(part.word)}</div>
      <div class="branches">
        ${q.groups.map(g=>`<div class="br"><b>${esc(g.reading)}</b>${names(g.who)}<br><small>${esc(g.codes)}</small></div>`).join('')}
        <div class="br sh"><b>الشاهد ${tick(part.shahid)}</b>${esc(q.shahid)}</div>
        <div class="br rest"><b>الباقون</b>${esc(q.rest)}</div>
      </div>
      <p class="hint" style="margin-top:10px">مواضع الرموز ${tick(part.toks)} · القراء ${tick(part.who)}<br><span style="font-size:12px">${esc(q.ref)}</span></p>
      <p class="hint" style="margin:6px 0">قارني كتابتك لوجه القراءة وقراءة الباقين بالخريطة:</p>
      <div class="self"><button data-s="1">كتبتها صح</button><button data-s="0">فيها نقص</button></div>
      ${part.word&&part.shahid?'':'<button class="flag" id="ovr">كتبتُ اللفظ أو الشاهد بصيغة صحيحة أخرى</button>'}
    </div>`;
    if($('#ovr'))$('#ovr').onclick=()=>{part.word=true;part.shahid=true;$('#ovr').remove();$('#w').className='ok';$('#sh').className='ok'};
    el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
      part.read=b.dataset.s==='1';
      const ok=part.word&&part.toks&&part.who&&part.shahid&&part.read;
      el.querySelector('.self').innerHTML=`<div class="fb ${ok?'ok':'no'}" style="margin:0;flex:1"><b>${ok?'الخريطة كاملة · +١ نقطة 🌷':'راجعي ما عليه ✗ ثم أعيديها لاحقاً'}</b></div>`;
      onDone(ok,'خريطة');
      if(!exam){el.insertAdjacentHTML('beforeend','<div class="row"><button class="go" id="nx">التالي</button></div>');$('#nx').onclick=onNext}
    });
  };
}

      body:JSON.stringify({p_device:S.dev,p_name:S.nick,p_correct:s.correct,p_answered:s.answered,p_mastery:s.mastery})});
    if(r.ok)LBC.t=0;
    return r.ok;
  }catch(e){return false}
}
function nameForm(change){
  app.innerHTML=`${hdr('go(home)')}
  <div class="unit-head"><h1>${change?'تغيير الاسم':'اسمك في المتصدرات'}</h1><p>اكتبي اسماً مستعاراً. يراه كل من عنده رابط الموقع.</p></div>
  <div class="field"><label for="nk">الاسم (حتى ٢٠ حرفاً)</label><input type="text" id="nk" maxlength="20" autocomplete="off" value="${esc(S.nick||'')}"></div>
  <div class="row"><button class="go" id="sv">حفظ والدخول</button></div>
  <p class="hint" style="text-align:right;margin-top:14px">لا حسابات ولا كلمات سر. يُرسل اسمك وعدد إجاباتك ونسبة إتقانك فقط.</p>`;
  const inp=$('#nk');inp.focus();
  const ok=()=>{const v=inp.value.trim().replace(/\s+/g,' ');if(!v){inp.focus();return}S.nick=v.slice(0,20);save();go(lbView)};
  $('#sv').onclick=ok;inp.onkeydown=e=>{if(e.key==='Enter')ok()};
}
async function lbView(sortKey){
  sortKey=sortKey||'correct';
  app.innerHTML=`${hdr('go(home)')}<div class="unit-head"><h1>المتصدرات</h1></div><div class="empty">جارٍ التحميل…</div>`;
  await submitScore();
  let rows;
  try{
    const r=await fetch(SB_URL+'/rest/v1/leaderboard?select=name,correct,answered,mastery,updated_at&updated_at=gte.2026-10-16T10:50:00Z&order=correct.desc&limit=200',{headers:{'apikey':SB_KEY}});
    if(!r.ok)throw new Error(r.status);
    rows=await r.json();
  }catch(e){
    app.innerHTML=`${hdr('go(home)')}<div class="unit-head"><h1>المتصدرات</h1></div>
    <div class="empty">تعذّر الاتصال باللوحة. تأكدي من الإنترنت وحاولي مرة أخرى.</div>
    <div class="row"><button class="go" onclick="go(lbView)">إعادة المحاولة</button></div>`;
    return;
  }
  const MIN=20;
  let list=rows.slice();
  if(sortKey==='mastery'){list=list.filter(r=>r.answered>=MIN).sort((a,b)=>b.mastery-a.mastery||b.correct-a.correct)}
  else list.sort((a,b)=>b.correct-a.correct||b.mastery-a.mastery);
  const me=list.findIndex(r=>r.name===S.nick);
  const medal=['🥇','🥈','🥉'];
  app.innerHTML=`${hdr('go(home)')}
  <div class="unit-head"><h1>المتصدرات</h1><p>كل إجابة صحيحة = نقطة · ${AR(rows.length)} مشاركة</p></div>
  ${ADM?'<div class="mine" style="background:var(--rose-soft)">وضع المشرف: اضغط × لحذف مشاركة. هذا الجهاز لا يظهر في اللوحة · <button class="lnk" id="adx">خروج</button></div>':''}
  <div class="seg"><button class="${sortKey==='correct'?'on':''}" data-k="correct">النقاط</button><button class="${sortKey==='mastery'?'on':''}" data-k="mastery">الإتقان</button></div>
  ${sortKey==='mastery'?`<p class="hint" style="text-align:right;margin:0">يدخل الإتقان بعد ${AR(MIN)} إجابة أو أكثر.</p>`:''}
  ${me>=0?`<div class="mine">ترتيبك: <b>${AR(me+1)}</b> من ${AR(list.length)} · نقاطك: <b>${AR(list[me].correct)}</b></div>`:`<div class="mine">${!S.nick?'<button class="lnk" id="reg">سجّلي اسمك لتظهري في اللوحة</button>':sortKey==='mastery'?'أجيبي عن ٢٠ سؤالاً لتظهري في هذا الترتيب.':'ابدئي التدريب لتظهري في اللوحة.'}</div>`}
  <div class="lb">${list.length?list.map((r,i)=>`<div class="lbr ${r.name===S.nick?'me':''} ${ADM?'adm':''}"><span class="rk">${i<3?medal[i]:AR(i+1)}</span><span class="nm">${esc(r.name)}<small>إتقان ${AR(r.mastery)}٪ · أجابت ${AR(r.answered)}</small></span><span class="sc">${AR(sortKey==='mastery'?r.mastery+'٪':r.correct)}</span>${ADM?`<button class="xdel" data-n="${esc(r.name)}" aria-label="حذف ${esc(r.name)}">×</button>`:''}</div>`).join(''):'<div class="empty">لا أحد بعد. كوني الأولى.</div>'}</div>
  ${S.nick?`<div class="row"><button class="lnk" id="chn">تغيير اسمي (${esc(S.nick)})</button></div>`:''}`;
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>lbView(b.dataset.k));
  if($('#chn'))$('#chn').onclick=()=>nameForm(true);
  if($('#reg'))$('#reg').onclick=()=>nameForm(false);
  LASTSORT=sortKey;
  if(ADM){
    app.querySelectorAll('.xdel').forEach(b=>b.onclick=()=>adminDelete(b.dataset.n));
    $('#adx').onclick=()=>{ADM='';try{sessionStorage.removeItem('hirz-adm')}catch(e){}lbView(sortKey)};
  }else{
    let taps=0,tt;
    app.querySelector('.unit-head h1').onclick=()=>{taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,2500);if(taps>=5){taps=0;adminForm()}};
  }
}

/* ===== وضع المشرف: حذف المشاركين (كلمة السر محفوظة في Supabase لا في الموقع) ===== */
let ADM='',LASTSORT='correct';
try{ADM=sessionStorage.getItem('hirz-adm')||''}catch(e){}
async function rpc(name,body){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
function adminForm(){
  app.innerHTML=`${hdr('go(lbView)')}
  <div class="unit-head"><h1>وضع المشرف</h1><p>أدخل كلمة السر.</p></div>
  <div class="field"><label for="pw">كلمة السر</label><input type="password" id="pw" autocomplete="off"></div>
  <div class="row"><button class="go" id="pwg">دخول</button></div>`;
  const inp=$('#pw');inp.focus();
  const go_=async()=>{
    const v=inp.value.trim();if(!v){inp.focus();return}
    $('#pwg').disabled=true;
    try{
      const ok=await rpc('admin_check',{p_password:v});
      if(ok===true){ADM=v;S.nick='';save();try{sessionStorage.setItem('hirz-adm',v)}catch(e){}go(lbView);return}
      alert('كلمة السر غير صحيحة.');
    }catch(e){alert('تعذّر الاتصال. تأكد من الإنترنت ومن تنفيذ نص Supabase.')}
    $('#pwg').disabled=false;
  };
  $('#pwg').onclick=go_;inp.onkeydown=e=>{if(e.key==='Enter')go_()};
}
async function adminDelete(name){
  if(!confirm('حذف «'+name+'» من اللوحة؟\nإذا تشاركت عدة مشاركات بهذا الاسم تُحذف كلها.'))return;
  try{
    const n=await rpc('admin_delete',{p_password:ADM,p_name:name});
    if(n===-1){ADM='';try{sessionStorage.removeItem('hirz-adm')}catch(e){}alert('كلمة السر لم تعد صالحة.');go(lbView);return}
    LBC={t:0,rows:null};lbView(LASTSORT);
  }catch(e){alert('تعذّر الحذف الآن. حاول مرة أخرى.')}
}

/* ===== الوضع الليلي وعدّاد الاختبار ===== */
const EXAM=[2026,9,11]; // 11 أكتوبر 2026 (الشهر يبدأ من 0)
function countdownHtml(){
  const t=new Date(), a=new Date(t.getFullYear(),t.getMonth(),t.getDate()), b=new Date(EXAM[0],EXAM[1],EXAM[2]);
  const d=Math.round((b-a)/86400000);
  if(d<0)return '';
  const txt=d===0?'الاختبار اليوم، بالتوفيق':d===1?'باقي يوم واحد على الاختبار':d===2?'باقي يومان على الاختبار':d<=10?`باقي ${AR(d)} أيام على الاختبار`:`باقي ${AR(d)} يوماً على الاختبار`;
  return `<div class="count">${txt}</div>`;
}
function isDark(){return S.theme?S.theme==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTheme(){
  const r=document.documentElement;
  if(S.theme)r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme');
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=isDark()?'#2A170F':'#F6E9D2';
}
function themeBtn(){return `<button class="theme" onclick="toggleTheme()" aria-label="تبديل الوضع الليلي">${isDark()?'☀️':'🌙'}</button>`}
function toggleTheme(){
  S.theme=isDark()?'light':'dark';save();applyTheme();
  document.querySelectorAll('.theme').forEach(b=>b.textContent=isDark()?'☀️':'🌙');
}
applyTheme();

/* ===== المتصدرات في الصفحة الرئيسية ===== */
let LBC={t:0,rows:null};
async function fetchRows(){
  const r=await fetch(SB_URL+'/rest/v1/leaderboard?select=name,correct,answered,mastery,updated_at&updated_at=gte.2026-10-16T10:50:00Z&order=correct.desc&limit=200',{headers:{'apikey':SB_KEY}});
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
function miniLbHtml(rows){
  const sorted=rows.slice().sort((a,b)=>b.correct-a.correct||b.mastery-a.mastery);
  const medal=['🥇','🥈','🥉'];
  const meIdx=S.nick?sorted.findIndex(r=>r.name===S.nick):-1;
  const row=(r,i)=>`<div class="lbr ${S.nick&&r.name===S.nick?'me':''}"><span class="rk">${i<3?medal[i]:AR(i+1)}</span><span class="nm">${esc(r.name)}</span><span class="sc">${AR(r.correct)}</span></div>`;
  let h=sorted.slice(0,5).map(row).join('');
  if(meIdx>=5)h+='<div class="gap">⋯</div>'+row(sorted[meIdx],meIdx);
  if(!sorted.length)h='<div class="empty" style="padding:14px">لا أحد بعد. كوني الأولى.</div>';
  const foot=S.nick?'':'<button class="lnk" onclick="go(nameForm,false)">سجّلي اسمك لتظهري في اللوحة</button>';
  return `<div class="lb mini">${h}</div>${foot}`;
}
async function loadHomeLb(){
  const box=()=>document.getElementById('lbbody');
  if(!box())return;
  const show=rows=>{const b=box();if(b)b.innerHTML=miniLbHtml(rows)};
  if(LBC.rows&&Date.now()-LBC.t<20000){show(LBC.rows);return}
  if(LBC.rows)show(LBC.rows);
  try{const rows=await fetchRows();LBC={t:Date.now(),rows};show(rows)}
  catch(e){const b=box();if(b&&!LBC.rows)b.innerHTML='<div class="empty" style="padding:14px">تعذّر تحميل المتصدرات.</div>'}
}


/* ===== أيقونات وحلقة التقدّم ===== */
const IC={
  practice:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M17 19h4"/>',
  exam:'<rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4h6v3H9z"/><path d="M9 14l2 2 4-4"/>',
  shahid:'<circle cx="12" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="19" r="2.2"/><path d="M12 7.2v4M12 11.2H6v5.6M12 11.2h6v5.6"/>',
  learn:'<path d="M3 5h6a3 3 0 013 3v11a2 2 0 00-2-2H3z"/><path d="M21 5h-6a3 3 0 00-3 3v11a2 2 0 012-2h7z"/>'
};
const ico=k=>`<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg></span>`;
const UCOL=['--rose','--lav','--mint'];
function ring(p,attr,cls){
  const C=113.1;
  return `<span class="ring ${cls||''}" ${attr||''}><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="tr" cx="22" cy="22" r="18" fill="none" stroke-width="5"/><circle class="pg" cx="22" cy="22" r="18" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-p/100)).toFixed(1)}"/></svg><b>${AR(p)}٪</b></span>`;
}
function countUp(el,to,dur,suffix){
  dur=dur||900;suffix=suffix||'';const t0=performance.now();
  const f=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=AR(Math.round(to*e))+suffix;if(k<1)requestAnimationFrame(f)};
  requestAnimationFrame(f);
}
function petals(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const box=document.createElement('div');box.className='petals';
  const em=['✦','❖','✧','•'];
  for(let i=0;i<22;i++){const s=document.createElement('span');s.textContent=em[i%em.length];
    s.style.cssText=`left:${(Math.random()*100).toFixed(1)}%;animation-delay:${(Math.random()*1.2).toFixed(2)}s;animation-duration:${(2.6+Math.random()*1.8).toFixed(2)}s;font-size:${(16+Math.random()*14).toFixed(0)}px`;
    box.appendChild(s)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),5400);
}

/* ===== قائمة الوحدات المنبثقة ===== */
function openUnits(){
  if(document.getElementById('sheet'))return;
  const el=document.createElement('div');el.id='sheet';el.className='backdrop';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="الوحدات">
    <div class="sh-grab"></div>
    <div class="sh-head"><div><b>الوحدات</b><small>${AR(UNITS.length)} وحدة · إتقانك العام ${AR(mastery())}٪</small></div><button class="back" id="shx">إغلاق</button></div>
    <div class="ugrid">${UNITS.map((u,i)=>{const p=mastery(u.id),n=BANK.filter(q=>q.unit===u.id).length;return `
      <button class="ucard" style="--ua:var(${UCOL[i%3]});animation-delay:${(.08+i*.04).toFixed(2)}s" onclick="go(unitView,'${u.id}')">
        <span class="uc-top"><span class="un">${AR(i+1)}</span>${ring(p)}</span>
        <span class="ut">${u.title}</span>
        <span class="up">${u.pages} · ${AR(n)} سؤالاً</span>
      </button>`}).join('')}</div></div>`;
  document.body.appendChild(el);
  document.body.style.overflow='hidden';
  el.onclick=e=>{if(e.target===el)closeUnits()};
  $('#shx').onclick=()=>closeUnits();$('#shx').focus();
}
function closeUnits(immediate){
  const el=document.getElementById('sheet');
  if(!el)return;
  document.body.style.overflow='';
  if(immediate===true||el.classList.contains('out')){el.remove();return}
  el.classList.add('out');
  setTimeout(()=>{if(el.parentNode)el.remove()},230);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeUnits()});

view=[home,[]];home();
